        let cameraFacing = 'user',
            cameraStream = null;

        function initCamera(win) {
            const video = win.querySelector('#camVideo');
            const gallery = win.querySelector('#camGallery');
            const photos = VFS.listFolder('/Pictures') || [];
            photos.filter(f => f.type === 'file' && ['png', 'jpg', 'jpeg'].some(e => f.name.endsWith(e))).forEach(f => {
                const img = document.createElement('img');
                const data = VFS.readFile('/Pictures/' + f.name);
                if (data) { img.src = data;
                    gallery.appendChild(img); }
            });

            async function startCamera(facing) {
                if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); }
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing,
                            width: { ideal: 640 } } });
                    video.srcObject = cameraStream;
                    win._mediaStream = cameraStream;
                } catch { video.textContent = '❌ Camera denied.';
                    video.style.display = 'flex';
                    video.style.alignItems = 'center';
                    video.style.justifyContent = 'center'; }
            }
            startCamera(cameraFacing);

            win.querySelector('#camCaptureBtn').addEventListener('click', () => {
                if (!cameraStream) return;
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const dataUrl = canvas.toDataURL('image/png');
                const name = 'photo_' + Date.now() + '.png';
                if (VFS.writeFile('/Pictures/' + name, dataUrl)) {
                    const img = document.createElement('img');
                    img.src = dataUrl;
                    gallery.prepend(img);
                    alert('✅ Saved to /Pictures/' + name);
                }
            });
            win.querySelector('#camFlipBtn').addEventListener('click', () => {
                cameraFacing = (cameraFacing === 'user') ? 'environment' : 'user';
                startCamera(cameraFacing);
            });
            win.querySelector('#camCloseBtn').addEventListener('click', () => closeWindow(win.id));
        }

        // ================================================================
        //  MICROPHONE
        // ================================================================
        function initMicrophone(win) {
            const canvas = win.querySelector('#audioVisualizer');
            const ctx = canvas.getContext('2d');
            const status = win.querySelector('#micStatus');
            let audioCtx = null,
                analyser = null,
                source = null,
                animFrame = null,
                micStream = null;
            let mediaRecorder = null,
                recordedChunks = [];

            function drawBars() {
                if (!analyser) return;
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(dataArray);
                const w = canvas.width,
                    h = canvas.height;
                ctx.clearRect(0, 0, w, h);
                const barWidth = (w / dataArray.length) * 2.5;
                for (let i = 0; i < dataArray.length; i++) {
                    const bh = (dataArray[i] / 255) * h;
                    ctx.fillStyle = `hsl(${i / dataArray.length * 240 + 200}, 80%, 50%)`;
                    ctx.fillRect(i * (barWidth + 1), h - bh, barWidth, bh);
                }
                animFrame = requestAnimationFrame(drawBars);
            }

            win.querySelector('#micStartBtn').addEventListener('click', async () => {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    win._mediaStream = micStream;
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    win._audioCtx = audioCtx;
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256;
                    source = audioCtx.createMediaStreamSource(micStream);
                    source.connect(analyser);
                    canvas.width = canvas.clientWidth * 2;
                    canvas.height = canvas.clientHeight * 2;
                    if (audioCtx.state === 'suspended') await audioCtx.resume();
                    recordedChunks = [];
                    mediaRecorder = new MediaRecorder(micStream);
                    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                    mediaRecorder.start(1000);
                    drawBars();
                    status.textContent = '🎤 Recording...';
                } catch { status.textContent = '❌ Microphone denied.'; }
            });

            win.querySelector('#micStopBtn').addEventListener('click', () => {
                if (animFrame) cancelAnimationFrame(animFrame);
                if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                if (audioCtx) audioCtx.close();
                if (micStream) micStream.getTracks().forEach(t => t.stop());
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                status.textContent = '⏹ Stopped. Click "Save to Recordings".';
            });

            win.querySelector('#micSaveBtn').addEventListener('click', () => {
                if (recordedChunks.length === 0) { alert('Record something first!'); return; }
                const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64 = e.target.result;
                    const name = 'recording_' + Date.now() + '.webm';
                    if (VFS.writeFile('/Recordings/' + name, base64)) {
                        alert('✅ Saved to /Recordings/' + name);
                        status.textContent = '💾 Saved!';
                    } else { alert('Save failed.'); }
                };
                reader.readAsDataURL(blob);
            });
        }

        // ================================================================
        //  SETTINGS - MEGA WITH NETWORK/BLUETOOTH
        // ================================================================
        function renderSettings(win) {
            const container = win.querySelector('#settingsContainer');
            const uptime = Math.floor((Date.now() - state.bootTime) / 1000);
            const days = Math.floor(uptime / 86400),
                hours = Math.floor((uptime % 86400) / 3600),
                mins = Math.floor((uptime % 3600) / 60);
            const uptimeStr = days > 0 ? `${days}d ${hours}h ${mins}m` : `${hours}h ${mins}m`;
            const mem = performance.memory ? (performance.memory.usedJSHeapSize / (1024 * 1024)).toFixed(1) : 'N/A';
            const totalMem = performance.memory ? (performance.memory.totalJSHeapSize / (1024 * 1024)).toFixed(1) : 'N/A';
            const cores = navigator.hardwareConcurrency || 'N/A';
            const devName = localStorage.getItem('opencore_device_name') || 'Opencore-PC';
            const wallpaper = localStorage.getItem('opencore_wallpaper') || '#16213e';
            const clientId = localStorage.getItem('opencore_spotify_client_id') || '';
            const clientSecret = localStorage.getItem('opencore_spotify_client_secret') || '';

            container.innerHTML = `
                <div class="settings-tabs">
                    <button class="active" data-tab="system">💻 System</button>
                    <button data-tab="network">📶 Network</button>
                    <button data-tab="bluetooth">📡 Bluetooth</button>
                    <button data-tab="personalize">🎨 Personalize</button>
                    <button data-tab="storage">💾 Storage</button>
                    <button data-tab="about">ℹ️ About</button>
                </div>
                <div class="settings-tab-content active" data-tab="system">
                    <div class="settings-row"><span class="label">Device Name</span><input type="text" id="devNameInput" value="${devName}" /><button class="btn" id="devNameSave">Rename</button></div>
                    <div class="settings-row"><span class="label">OS Version</span><span class="value">OpencoreOS v4.0</span></div>
                    <div class="settings-row"><span class="label">Uptime</span><span class="value">${uptimeStr}</span></div>
                    <div class="settings-row"><span class="label">CPU Cores</span><span class="value">${cores}</span></div>
                    <div class="settings-row"><span class="label">Memory</span><span class="value">${mem} MB / ${totalMem} MB</span></div>
                    <div class="settings-row"><span class="label">Display</span><span class="value">${window.innerWidth}x${window.innerHeight} (${window.devicePixelRatio}x)</span></div>
                    <div class="settings-row"><span class="label">Battery</span><span class="value" id="settingsBattery">Checking...</span></div>
                </div>
                <div class="settings-tab-content" data-tab="network">
                    <div class="settings-row"><span class="label">Wi-Fi</span><div class="toggle" id="wifiToggle"><div class="slider"></div></div><span id="wifiStatus">Off</span></div>
                    <div class="settings-row"><span class="label">Network Type</span><span class="value" id="netType">${navigator.connection ? navigator.connection.effectiveType : 'Unknown'}</span></div>
                    <div class="settings-row"><span class="label">IP (simulated)</span><span class="value">192.168.1.100</span></div>
                </div>
                <div class="settings-tab-content" data-tab="bluetooth">
                    <div class="settings-row"><span class="label">Bluetooth</span><div class="toggle" id="btToggle"><div class="slider"></div></div><span id="btStatus">Off</span></div>
                    <div class="settings-row"><span class="label">Devices</span><button class="btn" id="btScanBtn">🔍 Scan</button></div>
                    <div id="btDevices" style="color:#888;font-size:13px;">No devices scanned. Click "Scan".</div>
                </div>
                <div class="settings-tab-content" data-tab="personalize">
                    <div class="settings-row"><span class="label">Wallpaper</span><input type="color" id="wallColor" value="${wallpaper.replace('#','')}" /><button class="btn" id="wallApply">Apply</button><button class="btn-secondary" id="wallReset">Reset</button></div>
                    <div class="settings-row"><span class="label">Spotify Client ID</span><input type="text" id="spotifyId" value="${clientId}" style="flex:1;min-width:120px;" /></div>
                    <div class="settings-row"><span class="label">Spotify Secret</span><input type="text" id="spotifySecret" value="${clientSecret}" style="flex:1;min-width:120px;" /></div>
                    <div class="settings-row"><button class="btn" id="spotifySave">Save Spotify Credentials</button></div>
                </div>
                <div class="settings-tab-content" data-tab="storage">
                    <div class="settings-row"><span class="label">Total Files</span><span class="value">${VFS.getFileCount()}</span></div>
                    <div class="settings-row"><span class="label">Storage Used</span><span class="value">${(VFS.getTotalSize()/1024).toFixed(1)} KB</span></div>
                    <div class="settings-row"><button class="btn-secondary" id="clearNotepad">🗑️ Clear Documents</button></div>
                    <div class="settings-row"><button class="btn-secondary" id="clearPhotos">🗑️ Clear Pictures</button></div>
                    <div class="settings-row"><button class="btn-secondary" id="clearRecordings">🗑️ Clear Recordings</button></div>
                    <div class="settings-row"><button class="btn" id="clearAllVFS" style="background:#d43a3a;">⚠️ Delete ALL Files</button></div>
                </div>
                <div class="settings-tab-content" data-tab="about">
                    <div style="text-align:center;padding:20px;">
                        <div style="font-size:64px;">🪟</div>
                        <h2 style="font-weight:300;">OpencoreOS v4.0</h2>
                        <p style="color:#888;">"The Ultimate Edition"</p>
                        <p style="color:#666;font-size:13px;margin-top:10px;">Browser • Terminal • Task Manager • .oc Files • Music • Network</p>
                        <p style="color:#444;font-size:12px;margin-top:20px;">© 2026 OpencoreOS</p>
                    </div>
                </div>
            `;

            // Tab switching
            container.querySelectorAll('.settings-tabs button').forEach(tab => {
                tab.addEventListener('click', () => {
                    container.querySelectorAll('.settings-tabs button').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    container.querySelectorAll('.settings-tab-content').forEach(c => c.classList.remove('active'));
                    container.querySelector(`.settings-tab-content[data-tab="${tab.dataset.tab}"]`).classList.add(
                    'active');
                });
            });

            // Device Name
            container.querySelector('#devNameSave').addEventListener('click', () => {
                const name = container.querySelector('#devNameInput').value.trim() || 'Opencore-PC';
                localStorage.setItem('opencore_device_name', name);
                document.querySelector('.user-name').textContent = name;
                alert('Renamed to ' + name);
            });

            // Wallpaper
            container.querySelector('#wallApply').addEventListener('click', () => {
                const color = '#' + container.querySelector('#wallColor').value;
                const grad = `radial-gradient(ellipse at 20% 20%, ${color}, #0a0a1a)`;
                desktop.style.background = grad;
                localStorage.setItem('opencore_wallpaper', grad);
            });
            container.querySelector('#wallReset').addEventListener('click', () => {
                const grad = 'radial-gradient(ellipse at 20% 20%, #16213e, #0a0a1a)';
                desktop.style.background = grad;
                localStorage.setItem('opencore_wallpaper', grad);
                container.querySelector('#wallColor').value = '16213e';
            });

            // Spotify credentials
            container.querySelector('#spotifySave').addEventListener('click', () => {
                const id = container.querySelector('#spotifyId').value.trim();
                const secret = container.querySelector('#spotifySecret').value.trim();
                if (id && secret) {
                    localStorage.setItem('opencore_spotify_client_id', id);
                    localStorage.setItem('opencore_spotify_client_secret', secret);
                    alert('✅ Spotify credentials saved!');
                } else {
                    alert('Please enter both Client ID and Secret.');
                }
            });

            // Network Toggle (simulated)
            let wifiOn = false;
            container.querySelector('#wifiToggle').addEventListener('click', function() {
                wifiOn = !wifiOn;
                this.classList.toggle('on', wifiOn);
                container.querySelector('#wifiStatus').textContent = wifiOn ? 'On' : 'Off';
            });

            // Bluetooth Toggle + Scan
            let btOn = false;
            container.querySelector('#btToggle').addEventListener('click', function() {
                btOn = !btOn;
                this.classList.toggle('on', btOn);
                container.querySelector('#btStatus').textContent = btOn ? 'On' : 'Off';
                if (!btOn) container.querySelector('#btDevices').textContent = 'Bluetooth disabled.';
            });
            container.querySelector('#btScanBtn').addEventListener('click', () => {
                if (!btOn) { alert('Turn on Bluetooth first!'); return; }
                const devices = ['Headphones 🎧', 'Keyboard ⌨️', 'Mouse 🖱️', 'Speaker 🔊', 'Phone 📱'];
                const list = devices.map(d => `<div style="padding:4px 0;">🔵 ${d} <button style="background:#0078d4;border:none;color:white;padding:0 12px;border-radius:4px;cursor:pointer;font-size:12px;">Connect</button></div>`)
                    .join('');
                container.querySelector('#btDevices').innerHTML = list;
                // Connect buttons just simulate
                container.querySelectorAll('#btDevices button').forEach(b => {
                    b.addEventListener('click', () => {
                        b.textContent = 'Connected ✓';
                        b.style.background = '#4caf50';
                    });
                });
            });

            // Battery update
            async function updateBatterySettings() {
                if ('getBattery' in navigator) {
                    try {
                        const bat = await navigator.getBattery();
                        const el = container.querySelector('#settingsBattery');
                        if (el) el.textContent = `${Math.round(bat.level*100)}% ${bat.charging ? '⚡' : ''}`;
                    } catch {}
                }
            }
            updateBatterySettings();

            // Storage clear
            const clearFolder = (folder, msg) => {
                if (confirm(`Delete all files in /${folder}?`)) {
                    const entries = VFS.listFolder('/' + folder) || [];
                    entries.forEach(f => { if (f.type === 'file') VFS.deleteEntry('/' + folder + '/' + f.name); });
                    alert(msg);
                    renderSettings(win);
                }
            };
            container.querySelector('#clearNotepad').addEventListener('click', () => clearFolder('Documents',
                'Documents cleared.'));
            container.querySelector('#clearPhotos').addEventListener('click', () => clearFolder('Pictures',
            'Pictures cleared.'));
            container.querySelector('#clearRecordings').addEventListener('click', () => clearFolder('Recordings',
                'Recordings cleared.'));
            container.querySelector('#clearAllVFS').addEventListener('click', () => {
                if (confirm('⚠️ Delete ALL files?')) {
                    if (confirm('Are you sure?')) {
                        const root = VFS.getRoot();
                        root.children = { 'Documents': { type: 'folder', children: {} },
                            'Pictures': { type: 'folder', children: {} },
                            'Recordings': { type: 'folder', children: {} },
                            'Desktop': { type: 'folder', children: {} } };
                        VFS.saveRoot(root);
                        alert('All files deleted.');
                        renderSettings(win);
                    }
                }
            });
        }

        // ================================================================
        //  EVENT BINDINGS
        // ================================================================
        document.querySelectorAll('.desktop-icon').forEach(el => {
            el.addEventListener('dblclick', () => { const app = el.dataset.app; if (app) launchApp(app); });
        });
        document.querySelectorAll('.start-item').forEach(el => {
            el.addEventListener('click', () => {
                const app = el.dataset.app;
                if (app) { launchApp(app);
                    startMenu.classList.remove('open'); }
            });
        });
        document.getElementById('desktopRecycle').addEventListener('dblclick', () => {
            launchApp('explorer');
            setTimeout(() => {
                const win = state.windows.find(w => w.appId === 'explorer');
                if (win) {
                    win.element.querySelector('.window-body').innerHTML =
                        `<p style="color:#666;text-align:center;padding:30px;">🗑️ Recycle Bin is empty.</p>`;
                }
            }, 200);
        });

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'e') { e.preventDefault();
                launchApp('explorer'); }
            if (e.ctrlKey && e.key === 'n') { e.preventDefault();
                launchApp('notepad'); }
            if (e.ctrlKey && e.key === 'b') { e.preventDefault();
                launchApp('browser'); }
            if (e.ctrlKey && e.key === 't') { e.preventDefault();
                launchApp('terminal'); }
            if (e.key === 'Escape' && state.windows.length > 0) {
                const last = state.windows[state.windows.length - 1];
                closeWindow(last.id);
            }
        });

        console.log('🪟 OpencoreOS v4.0 booted!');
        console.log('🌐 Browser: load any website');
        console.log('💻 Terminal: ls, cd, mkdir, touch, cat, echo, rm, clear, uptime, whoami, date, pwd');
        console.log('📦 .oc files: wrappers for any file type');
        console.log('🎵 Music: Spotify search & embed');
        console.log('📶 Network & Bluetooth management in Settings');
    </script>
</body>
</html>
