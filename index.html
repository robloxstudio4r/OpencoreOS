<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpencoreOS v3.1</title>
    <style>
        /* ===== GLOBAL RESET & VARIABLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
            user-select: none;
        }
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --glass-bg: rgba(28, 28, 48, 0.92);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #eee;
            --text-secondary: #aaa;
            --accent: #0078d4;
            --shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-primary);
            position: relative;
        }

        /* ===== SETUP WIZARD ===== */
        #setupWizard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a2e, #0a0a1a);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            transition: opacity 0.8s;
        }
        #setupWizard.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #setupWizard .logo {
            font-size: 72px;
            margin-bottom: 10px;
        }
        #setupWizard h1 {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        #setupWizard .subtitle {
            color: #888;
            font-size: 16px;
            margin-bottom: 30px;
        }
        #setupWizard .progress-container {
            width: 400px;
            max-width: 80%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            height: 6px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        #setupWizard .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #00b4d8);
            border-radius: 12px;
            transition: width 0.3s;
        }
        #setupWizard .status-text {
            margin-top: 14px;
            color: #aaa;
            font-size: 14px;
            font-weight: 300;
        }

        /* ===== DESKTOP ===== */
        #desktop {
            width: 100%;
            height: calc(100% - 50px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 20px;
            background: radial-gradient(ellipse at 20% 20%, var(--bg-secondary), var(--bg-primary));
            transition: background 0.5s;
            position: relative;
        }
        .desktop-icon {
            width: 85px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: white;
            font-size: 13px;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            transition: background 0.2s, transform 0.1s;
            background: transparent;
            border: none;
        }
        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.02);
        }
        .desktop-icon:active {
            transform: scale(0.95);
        }
        .desktop-icon .icon {
            font-size: 48px;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
        }
        .desktop-icon .label {
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
            font-size: 12px;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        /* ===== TASKBAR ===== */
        #taskbar {
            height: 50px;
            background: rgba(20, 20, 40, 0.88);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 6px;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.4);
        }
        #start-btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: white;
            padding: 4px 14px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
            height: 34px;
            border: 1px solid var(--border-color);
        }
        #start-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .taskbar-apps {
            display: flex;
            gap: 2px;
            flex: 1;
            padding: 0 8px;
            overflow-x: auto;
            align-items: center;
        }
        .taskbar-app {
            background: transparent;
            border: none;
            color: #ccc;
            padding: 4px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s;
            height: 32px;
            white-space: nowrap;
            border: 1px solid transparent;
        }
        .taskbar-app:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .taskbar-app.active {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border-color: var(--border-color);
        }
        #systemTray {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #aaa;
            font-size: 13px;
            padding: 0 6px;
        }
        #systemTray .tray-icon {
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.15s;
        }
        #systemTray .tray-icon:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        #clock {
            color: white;
            font-size: 13px;
            padding: 0 6px;
            min-width: 80px;
            text-align: center;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
        }

        /* ===== START MENU ===== */
        #start-menu {
            position: fixed;
            bottom: 56px;
            left: 8px;
            width: 360px;
            background: rgba(22, 22, 40, 0.96);
            backdrop-filter: blur(24px);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 16px;
            display: none;
            z-index: 10000;
            box-shadow: 0 16px 60px rgba(0, 0, 0, 0.7);
            max-height: 450px;
            overflow-y: auto;
        }
        #start-menu.open {
            display: block;
        }
        #start-menu .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px;
        }
        #start-menu .header .user-icon {
            font-size: 32px;
        }
        #start-menu .header .user-name {
            color: white;
            font-weight: 500;
            font-size: 16px;
        }
        #start-menu .header .user-status {
            color: #666;
            font-size: 12px;
        }
        #start-menu .section {
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 4px 4px 4px;
        }
        .start-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: #ddd;
            transition: background 0.12s;
            font-size: 14px;
        }
        .start-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: white;
        }
        .start-item .icon {
            font-size: 20px;
            width: 28px;
            text-align: center;
        }

        /* ===== WINDOWS ===== */
        .window {
            position: absolute;
            min-width: 340px;
            min-height: 200px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: windowIn 0.2s ease;
        }
        @keyframes windowIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .window-header {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 44px;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .window-controls {
            display: flex;
            gap: 6px;
        }
        .window-controls button {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            transition: background 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
        }
        .window-controls .close-btn:hover {
            background: #e81123;
            color: white;
        }
        .window-controls .max-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: white;
        }
        .window-controls .min-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: white;
        }
        .window-body {
            flex: 1;
            padding: 16px;
            color: var(--text-primary);
            overflow: auto;
            font-size: 14px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }
        .window-body textarea {
            width: 100%;
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 14px;
            padding: 12px;
            border-radius: 6px;
            resize: none;
            outline: none;
            font-family: 'Consolas', monospace;
            min-height: 150px;
        }
        .window-body textarea:focus {
            border-color: rgba(0, 120, 212, 0.3);
        }

        /* ===== VFS FILE EXPLORER ===== */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            padding: 4px;
        }
        .file-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            border: 1px solid transparent;
            text-align: center;
            color: #ccc;
            font-size: 12px;
        }
        .file-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-color);
        }
        .file-item .icon {
            font-size: 32px;
            margin-bottom: 4px;
        }
        .file-item .name {
            word-break: break-all;
            line-height: 1.2;
            max-width: 80px;
            font-size: 11px;
        }
        .file-item.folder .icon {
            color: #ffd700;
        }
        .file-item.image .icon {
            color: #4fc3f7;
        }
        .file-item.text .icon {
            color: #81c784;
        }
        .file-item.audio .icon {
            color: #ff8a65;
        }
        .file-toolbar {
            display: flex;
            gap: 8px;
            padding: 6px 0 12px 0;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
            align-items: center;
        }
        .file-toolbar button {
            background: rgba(255, 255, 255, 0.04);
            border: none;
            color: #ccc;
            padding: 4px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s;
        }
        .file-toolbar button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .file-toolbar .path-display {
            color: #666;
            font-size: 12px;
            flex: 1;
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== SETTINGS (Tabs & Stats) ===== */
        .settings-tabs {
            display: flex;
            gap: 2px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .settings-tabs button {
            background: transparent;
            border: none;
            color: #888;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
        }
        .settings-tabs button:hover {
            color: white;
        }
        .settings-tabs button.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .settings-tab-content {
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        .settings-tab-content.active {
            display: flex;
        }
        .settings-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .settings-row .label {
            color: var(--text-secondary);
            min-width: 100px;
            font-size: 14px;
        }
        .settings-row .value {
            color: white;
            font-size: 14px;
            flex: 1;
        }
        .settings-row input[type="color"] {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
            padding: 0;
        }
        .settings-row input[type="text"] {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
            width: 150px;
        }
        .settings-row input[type="text"]:focus {
            border-color: var(--accent);
        }
        .settings-row .btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 4px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 13px;
        }
        .settings-row .btn:hover {
            background: #106ebe;
        }
        .settings-row .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #ccc;
            padding: 4px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 13px;
        }
        .settings-row .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .stat-bar {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            height: 6px;
            width: 100%;
            max-width: 200px;
            overflow: hidden;
        }
        .stat-bar .fill {
            height: 100%;
            background: var(--accent);
            border-radius: 6px;
            transition: width 0.5s;
        }

        /* ===== APP STORE ===== */
        .app-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 14px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            transition: background 0.2s;
            margin-bottom: 8px;
        }
        .app-card:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .app-card .info {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .app-card .info .icon {
            font-size: 28px;
        }
        .app-card .info .name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
        }
        .app-card .info .desc {
            font-size: 13px;
            color: #777;
        }
        .app-card .launch-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 4px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .app-card .launch-btn:hover {
            background: #106ebe;
        }

        /* ===== CALCULATOR ===== */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 8px;
        }
        .calc-grid button {
            padding: 12px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            cursor: pointer;
            transition: background 0.12s;
        }
        .calc-grid button:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .calc-grid .op {
            background: rgba(0, 120, 212, 0.2);
        }
        .calc-grid .op:hover {
            background: rgba(0, 120, 212, 0.35);
        }
        .calc-grid .eq {
            background: var(--accent);
        }
        .calc-grid .eq:hover {
            background: #106ebe;
        }
        #calcDisplay {
            background: rgba(0, 0, 0, 0.2);
            padding: 14px;
            border-radius: 6px;
            text-align: right;
            font-size: 26px;
            font-weight: 300;
            margin-bottom: 8px;
            min-height: 50px;
            color: white;
            border: 1px solid var(--border-color);
            width: 100%;
            font-family: 'Consolas', monospace;
        }

        /* ===== CAMERA ===== */
        #camVideo {
            width: 100%;
            background: #0a0a1a;
            border-radius: 8px;
            aspect-ratio: 4/3;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }
        .cam-controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .cam-controls button {
            padding: 5px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.06);
            color: white;
            transition: background 0.15s;
        }
        .cam-controls button.primary {
            background: var(--accent);
        }
        .cam-controls button.primary:hover {
            background: #106ebe;
        }
        .cam-controls button.danger {
            background: #d43a3a;
        }
        .cam-controls button.danger:hover {
            background: #b02b2b;
        }
        .cam-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
            max-height: 100px;
            overflow-y: auto;
            padding: 4px;
        }
        .cam-gallery img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        /* ===== MICROPHONE ===== */
        #audioVisualizer {
            width: 100%;
            height: 120px;
            background: #0a0a1a;
            border-radius: 8px;
            display: block;
            border: 1px solid var(--border-color);
        }
        .mic-status {
            color: var(--text-secondary);
            margin-top: 8px;
            font-size: 13px;
        }

        /* ===== IMAGE VIEWER ===== */
        .image-viewer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 200px;
        }
        .image-viewer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>

    <!-- ===== SETUP WIZARD ===== -->
    <div id="setupWizard">
        <div class="logo">🪟</div>
        <h1>OpencoreOS</h1>
        <div class="subtitle">Preparing your system...</div>
        <div class="progress-container">
            <div class="progress-bar" id="setupProgress"></div>
        </div>
        <div class="status-text" id="setupStatus">Initializing...</div>
    </div>

    <!-- ===== DESKTOP ===== -->
    <div id="desktop">
        <button class="desktop-icon" data-app="explorer"><span class="icon">📁</span><span class="label">Files</span></button>
        <button class="desktop-icon" data-app="notepad"><span class="icon">📝</span><span class="label">Notepad</span></button>
        <button class="desktop-icon" data-app="camera"><span class="icon">📷</span><span class="label">Camera</span></button>
        <button class="desktop-icon" data-app="microphone"><span class="icon">🎤</span><span class="label">Microphone</span></button>
        <button class="desktop-icon" data-app="appstore"><span class="icon">🛒</span><span class="label">App Store</span></button>
        <button class="desktop-icon" data-app="calculator"><span class="icon">🧮</span><span class="label">Calculator</span></button>
        <button class="desktop-icon" data-app="settings"><span class="icon">⚙️</span><span class="label">Settings</span></button>
        <button class="desktop-icon" id="desktopRecycle"><span class="icon">🗑️</span><span class="label">Recycle Bin</span></button>
    </div>

    <!-- ===== START MENU ===== -->
    <div id="start-menu">
        <div class="header"><span class="user-icon">👤</span><div><div class="user-name">Opencore User</div><div class="user-status">System ready</div></div></div>
        <div class="section">📌 Pinned</div>
        <div class="start-item" data-app="explorer"><span class="icon">📁</span> File Explorer</div>
        <div class="start-item" data-app="notepad"><span class="icon">📝</span> Notepad</div>
        <div class="start-item" data-app="camera"><span class="icon">📷</span> Camera</div>
        <div class="start-item" data-app="microphone"><span class="icon">🎤</span> Microphone</div>
        <div class="section">🎯 All Apps</div>
        <div class="start-item" data-app="appstore"><span class="icon">🛒</span> App Store</div>
        <div class="start-item" data-app="calculator"><span class="icon">🧮</span> Calculator</div>
        <div class="start-item" data-app="settings"><span class="icon">⚙️</span> Settings</div>
        <div class="start-item" id="shutdownBtn"><span class="icon">⏻</span> Restart OS</div>
    </div>

    <!-- ===== TASKBAR ===== -->
    <div id="taskbar">
        <button id="start-btn">🪟 Start</button>
        <div class="taskbar-apps" id="taskbarApps"></div>
        <div id="systemTray">
            <span class="tray-icon" title="Network">📶</span>
            <span class="tray-icon" title="Sound">🔊</span>
            <span class="tray-icon" title="Battery">🔋</span>
        </div>
        <div id="clock">00:00:00</div>
    </div>

    <script>
        // ================================================================
        //  OPENCOREOS v3.1 - INTERNAL VFS + MEGA SETTINGS
        // ================================================================

        // ---------- STATE ----------
        const state = {
            windows: [],
            nextZIndex: 100,
            windowCounter: 0,
            setupComplete: false,
            bootTime: Date.now(),
        };

        // ---------- DOM REFS ----------
        const desktop = document.getElementById('desktop');
        const startMenu = document.getElementById('start-menu');
        const startBtn = document.getElementById('start-btn');
        const clockEl = document.getElementById('clock');
        const taskbarApps = document.getElementById('taskbarApps');
        const setupWizard = document.getElementById('setupWizard');
        const setupProgress = document.getElementById('setupProgress');
        const setupStatus = document.getElementById('setupStatus');

        // ================================================================
        //  VIRTUAL FILE SYSTEM (VFS) - INTERNAL STORAGE
        // ================================================================
        const VFS = {
            init() {
                if (!localStorage.getItem('opencore_vfs')) {
                    const root = {
                        type: 'folder',
                        children: {
                            'Documents': { type: 'folder', children: {} },
                            'Pictures': { type: 'folder', children: {} },
                            'Recordings': { type: 'folder', children: {} },
                            'Desktop': { type: 'folder', children: {} },
                            'readme.txt': {
                                type: 'file',
                                content: 'Welcome to OpencoreOS!\n\nYour files are stored inside this OS.\nCreate, edit, and save everything here.'
                            }
                        }
                    };
                    localStorage.setItem('opencore_vfs', JSON.stringify(root));
                }
            },
            getRoot() {
                return JSON.parse(localStorage.getItem('opencore_vfs'));
            },
            saveRoot(root) {
                localStorage.setItem('opencore_vfs', JSON.stringify(root));
            },
            getNode(path) {
                const parts = path.split('/').filter(p => p);
                let node = this.getRoot();
                for (const part of parts) {
                    if (!node.children || !node.children[part]) return null;
                    node = node.children[part];
                }
                return node;
            },
            readFile(path) {
                const node = this.getNode(path);
                return node && node.type === 'file' ? node.content : null;
            },
            writeFile(path, content) {
                const parts = path.split('/').filter(p => p);
                const fileName = parts.pop();
                const root = this.getRoot();
                let node = root;
                for (const part of parts) {
                    if (!node.children[part]) {
                        node.children[part] = { type: 'folder', children: {} };
                    }
                    node = node.children[part];
                }
                node.children[fileName] = { type: 'file', content: content };
                this.saveRoot(root);
                return true;
            },
            listFolder(path) {
                const node = this.getNode(path);
                if (!node || node.type !== 'folder') return null;
                return Object.keys(node.children).map(name => ({
                    name,
                    ...node.children[name]
                }));
            },
            createFolder(path) {
                const parts = path.split('/').filter(p => p);
                const folderName = parts.pop();
                const root = this.getRoot();
                let node = root;
                for (const part of parts) {
                    if (!node.children[part]) {
                        node.children[part] = { type: 'folder', children: {} };
                    }
                    node = node.children[part];
                }
                if (!node.children[folderName]) {
                    node.children[folderName] = { type: 'folder', children: {} };
                    this.saveRoot(root);
                    return true;
                }
                return false;
            },
            deleteEntry(path) {
                const parts = path.split('/').filter(p => p);
                const name = parts.pop();
                const root = this.getRoot();
                let node = root;
                for (const part of parts) {
                    if (!node.children[part]) return false;
                    node = node.children[part];
                }
                if (node.children[name]) {
                    delete node.children[name];
                    this.saveRoot(root);
                    return true;
                }
                return false;
            },
            getTotalSize() {
                const root = this.getRoot();
                const calc = (node) => {
                    let size = 0;
                    if (node.type === 'file') {
                        return new Blob([node.content || '']).size;
                    }
                    if (node.children) {
                        for (const key in node.children) {
                            size += calc(node.children[key]);
                        }
                    }
                    return size;
                };
                return calc(root);
            },
            getFileCount() {
                const root = this.getRoot();
                let count = 0;
                const walk = (node) => {
                    if (node.type === 'file') count++;
                    if (node.children) {
                        for (const key in node.children) {
                            walk(node.children[key]);
                        }
                    }
                };
                walk(root);
                return count;
            }
        };
        VFS.init();

        // ================================================================
        //  SETUP WIZARD
        // ================================================================
        function runSetupWizard() {
            const steps = [
                'Formatting virtual drive...',
                'Creating system folders...',
                'Installing core components...',
                'Configuring user settings...',
                'Optimizing performance...',
                'Finalizing setup...',
            ];
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 3 + 1;
                if (progress > 100) progress = 100;
                setupProgress.style.width = progress + '%';
                const idx = Math.min(Math.floor(progress / 17), steps.length - 1);
                setupStatus.textContent = steps[idx] || 'Almost ready...';
                if (progress >= 100) {
                    clearInterval(interval);
                    setupStatus.textContent = '✅ Installation complete!';
                    setTimeout(() => {
                        setupWizard.classList.add('hidden');
                        state.setupComplete = true;
                        localStorage.setItem('opencore_setup_done', 'true');
                        loadSavedSettings();
                        updateClock();
                        setInterval(updateClock, 1000);
                    }, 600);
                }
            }, 1200);
        }

        if (localStorage.getItem('opencore_setup_done') === 'true') {
            setupWizard.classList.add('hidden');
            state.setupComplete = true;
            loadSavedSettings();
            updateClock();
            setInterval(updateClock, 1000);
        } else {
            runSetupWizard();
        }

        // ================================================================
        //  SAVED SETTINGS
        // ================================================================
        function loadSavedSettings() {
            const wallpaper = localStorage.getItem('opencore_wallpaper');
            if (wallpaper) desktop.style.background = wallpaper;
            const devName = localStorage.getItem('opencore_device_name') || 'Opencore-PC';
            document.querySelector('.user-name').textContent = devName;
        }

        // ================================================================
        //  CLOCK
        // ================================================================
        function updateClock() {
            const now = new Date();
            clockEl.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        // ================================================================
        //  START MENU
        // ================================================================
        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startMenu.classList.toggle('open');
        });
        document.addEventListener('click', () => startMenu.classList.remove('open'));
        document.getElementById('shutdownBtn').addEventListener('click', () => {
            if (confirm('Restart OpencoreOS?')) location.reload();
        });

        // ================================================================
        //  WINDOW MANAGER (SINGLE INSTANCE)
        // ================================================================
        function createWindow(appId, title, icon, contentHTML, width = 520, height = 360) {
            // SINGLE INSTANCE CHECK: If window exists, focus it.
            const existing = state.windows.find(w => w.appId === appId);
            if (existing) {
                if (existing.minimized) {
                    existing.minimized = false;
                    existing.element.style.display = 'flex';
                    updateTaskbar();
                }
                focusWindow(existing.id);
                return existing.element;
            }

            const id = `win-${++state.windowCounter}`;
            const zIndex = ++state.nextZIndex;

            const win = document.createElement('div');
            win.className = 'window';
            win.id = id;
            win.style.width = width + 'px';
            win.style.height = height + 'px';
            const left = Math.max(10, Math.min(window.innerWidth - width - 20, 30 + (state.windows.length % 6) * 35));
            const top = Math.max(10, Math.min(window.innerHeight - height - 70, 30 + (state.windows.length % 6) * 25));
            win.style.left = left + 'px';
            win.style.top = top + 'px';
            win.style.zIndex = zIndex;

            win.innerHTML = `
                <div class="window-header">
                    <span class="window-title">${icon} ${title}</span>
                    <div class="window-controls">
                        <button class="min-btn" title="Minimize">─</button>
                        <button class="max-btn" title="Maximize">⬜</button>
                        <button class="close-btn" title="Close">✕</button>
                    </div>
                </div>
                <div class="window-body">${contentHTML}</div>
            `;
            document.body.appendChild(win);

            // Drag
            const header = win.querySelector('.window-header');
            let isDragging = false,
                offsetX, offsetY;
            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('.window-controls')) return;
                isDragging = true;
                const rect = win.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                win.style.zIndex = ++state.nextZIndex;
                win.style.cursor = 'grabbing';
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                let x = e.clientX - offsetX;
                let y = e.clientY - offsetY;
                x = Math.max(0, Math.min(window.innerWidth - 100, x));
                y = Math.max(0, Math.min(window.innerHeight - 80, y));
                win.style.left = x + 'px';
                win.style.top = y + 'px';
            });
            document.addEventListener('mouseup', () => {
                if (isDragging) { isDragging = false;
                    win.style.cursor = 'default'; }
            });

            // Controls
            win.querySelector('.close-btn').addEventListener('click', () => closeWindow(id));
            win.querySelector('.max-btn').addEventListener('click', () => toggleMaximize(id));
            win.querySelector('.min-btn').addEventListener('click', () => minimizeWindow(id));

            win.addEventListener('mousedown', () => { win.style.zIndex = ++state.nextZIndex; });

            state.windows.push({ id, appId, element: win, minimized: false });
            updateTaskbar();
            return win;
        }

        function closeWindow(id) {
            const idx = state.windows.findIndex(w => w.id === id);
            if (idx === -1) return;
            const win = state.windows[idx].element;
            if (win._mediaStream) win._mediaStream.getTracks().forEach(t => t.stop());
            if (win._animFrame) cancelAnimationFrame(win._animFrame);
            if (win._audioCtx) win._audioCtx.close();
            win.remove();
            state.windows.splice(idx, 1);
            updateTaskbar();
        }

        function toggleMaximize(id) {
            const win = state.windows.find(w => w.id === id);
            if (!win) return;
            const el = win.element;
            if (el.style.width === window.innerWidth - 4 + 'px') {
                el.style.width = '520px';
                el.style.height = '360px';
                el.style.left = '40px';
                el.style.top = '40px';
                el.style.borderRadius = '10px';
            } else {
                el.dataset.prevRect = JSON.stringify({ left: el.style.left, top: el.style.top, width: el.style.width,
                    height: el.style.height });
                el.style.width = window.innerWidth - 4 + 'px';
                el.style.height = window.innerHeight - 54 + 'px';
                el.style.left = '0px';
                el.style.top = '0px';
                el.style.borderRadius = '0';
            }
        }

        function minimizeWindow(id) {
            const win = state.windows.find(w => w.id === id);
            if (!win) return;
            win.minimized = !win.minimized;
            win.element.style.display = win.minimized ? 'none' : 'flex';
            updateTaskbar();
        }

        function focusWindow(id) {
            const win = state.windows.find(w => w.id === id);
            if (win) {
                win.element.style.zIndex = ++state.nextZIndex;
                if (win.minimized) {
                    win.minimized = false;
                    win.element.style.display = 'flex';
                    updateTaskbar();
                }
            }
        }

        function updateTaskbar() {
            taskbarApps.innerHTML = '';
            state.windows.forEach(w => {
                const btn = document.createElement('button');
                btn.className = 'taskbar-app' + (w.minimized ? '' : ' active');
                btn.textContent = w.element.querySelector('.window-title')?.textContent || 'App';
                btn.dataset.winId = w.id;
                btn.addEventListener('click', () => {
                    if (w.minimized) {
                        w.minimized = false;
                        w.element.style.display = 'flex';
                        updateTaskbar();
                    } else {
                        minimizeWindow(w.id);
                    }
                    focusWindow(w.id);
                });
                taskbarApps.appendChild(btn);
            });
        }

        // ================================================================
        //  VFS FILE EXPLORER (RENDERER)
        // ================================================================
        let currentVFSPath = '/';

        function renderFileExplorer(win, path) {
            const body = win.querySelector('.window-body');
            const entries = VFS.listFolder(path);
            const displayPath = path === '/' ? 'Root' : path;

            let html = `
                <div class="file-toolbar">
                    <button id="vfsBackBtn">⬅ Back</button>
                    <button id="vfsHomeBtn">🏠 Home</button>
                    <button id="vfsNewFolderBtn">📁 New Folder</button>
                    <button id="vfsNewFileBtn">📄 New File</button>
                    <span class="path-display">📂 ${displayPath}</span>
                </div>
                <div class="file-grid" id="vfsGrid">
            `;

            if (entries && entries.length > 0) {
                const sorted = entries.sort((a, b) => {
                    if (a.type === 'folder' && b.type !== 'folder') return -1;
                    if (a.type !== 'folder' && b.type === 'folder') return 1;
                    return a.name.localeCompare(b.name);
                });
                for (const entry of sorted) {
                    const isFolder = entry.type === 'folder';
                    const icon = isFolder ? '📁' : getVFSFileIcon(entry.name);
                    const cls = isFolder ? 'file-item folder' : 'file-item';
                    const name = entry.name.length > 18 ? entry.name.slice(0, 15) + '…' : entry.name;
                    html += `
                        <div class="${cls}" data-name="${entry.name}" data-type="${entry.type}">
                            <span class="icon">${icon}</span>
                            <span class="name">${name}</span>
                        </div>
                    `;
                }
            } else {
                html += `<p style="color:#666;padding:20px;text-align:center;">📂 This folder is empty.</p>`;
            }
            html += `</div>`;
            body.innerHTML = html;

            // Event listeners
            body.querySelectorAll('.file-item').forEach(el => {
                el.addEventListener('dblclick', () => {
                    const name = el.dataset.name;
                    const type = el.dataset.type;
                    const newPath = path === '/' ? '/' + name : path + '/' + name;

                    if (type === 'folder') {
                        currentVFSPath = newPath;
                        renderFileExplorer(win, newPath);
                    } else {
                        // File
                        const content = VFS.readFile(newPath);
                        if (content !== null) {
                            const ext = name.split('.').pop().toLowerCase();
                            if (['png', 'jpg', 'jpeg', 'gif', 'bmp', 'svg', 'webp'].includes(ext)) {
                                // Image
                                const imgWin = createWindow('imageviewer', 'Image Viewer', '🖼️',
                                    `<div class="image-viewer"><img src="${content}" alt="${name}" /></div>`,
                                    540, 420);
                            } else if (['txt', 'md', 'json', 'js', 'html', 'css', 'xml'].includes(ext)) {
                                launchApp('notepad', { path: newPath, content });
                            } else {
                                alert('📄 File: ' + name + '\nContent length: ' + content.length + ' chars');
                            }
                        } else {
                            alert('Could not read file.');
                        }
                    }
                });
            });

            // Toolbar
            body.querySelector('#vfsBackBtn').addEventListener('click', () => {
                if (path !== '/') {
                    const parent = path.split('/').slice(0, -1).join('/') || '/';
                    currentVFSPath = parent;
                    renderFileExplorer(win, parent);
                }
            });
            body.querySelector('#vfsHomeBtn').addEventListener('click', () => {
                currentVFSPath = '/';
                renderFileExplorer(win, '/');
            });
            body.querySelector('#vfsNewFolderBtn').addEventListener('click', () => {
                const name = prompt('New folder name:');
                if (name) {
                    const newPath = path === '/' ? '/' + name : path + '/' + name;
                    if (VFS.createFolder(newPath)) {
                        renderFileExplorer(win, path);
                    } else {
                        alert('Folder already exists or invalid name.');
                    }
                }
            });
            body.querySelector('#vfsNewFileBtn').addEventListener('click', () => {
                const name = prompt('New file name (e.g., note.txt):');
                if (name) {
                    const newPath = path === '/' ? '/' + name : path + '/' + name;
                    if (VFS.writeFile(newPath, '')) {
                        renderFileExplorer(win, path);
                    } else {
                        alert('Could not create file.');
                    }
                }
            });
        }

        function getVFSFileIcon(name) {
            const ext = name.split('.').pop().toLowerCase();
            const icons = {
                'png': '🖼️',
                'jpg': '🖼️',
                'jpeg': '🖼️',
                'gif': '🖼️',
                'svg': '🖼️',
                'webp': '🖼️',
                'txt': '📄',
                'md': '📄',
                'json': '📄',
                'js': '📄',
                'html': '🌐',
                'css': '🎨',
                'xml': '📄',
                'pdf': '📕',
                'doc': '📘',
                'mp3': '🎵',
                'wav': '🎵',
                'mp4': '🎬',
            };
            return icons[ext] || '📄';
        }

        // ================================================================
        //  APP LAUNCHER (SINGLE INSTANCE)
        // ================================================================
        function launchApp(appId, extraData) {
            // Single instance enforcement
            const existing = state.windows.find(w => w.appId === appId);
            if (existing) {
                if (existing.minimized) {
                    existing.minimized = false;
                    existing.element.style.display = 'flex';
                    updateTaskbar();
                }
                focusWindow(existing.id);
                return;
            }

            let win;
            switch (appId) {
                case 'explorer':
                    win = createWindow(appId, 'File Explorer', '📁', '', 640, 420);
                    setTimeout(() => {
                        currentVFSPath = '/';
                        renderFileExplorer(win, '/');
                    }, 50);
                    break;

                case 'notepad': {
                    let path = '/Documents/note.txt';
                    let content = '';
                    if (extraData && extraData.path) {
                        path = extraData.path;
                        content = extraData.content || VFS.readFile(path) || '';
                    } else {
                        content = VFS.readFile(path) || 'Write something...';
                    }
                    const fileName = path.split('/').pop();
                    win = createWindow(appId, 'Notepad - ' + fileName, '📝',
                        `<textarea id="notepadText">${content}</textarea>
                        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
                            <button id="npSaveBtn" style="background:#0078d4;border:none;color:white;padding:4px 16px;border-radius:4px;cursor:pointer;">💾 Save to OS</button>
                            <button id="npExportBtn" style="background:rgba(255,255,255,0.06);border:none;color:#ccc;padding:4px 16px;border-radius:4px;cursor:pointer;">📥 Export to Device</button>
                            <span style="color:#666;font-size:12px;display:flex;align-items:center;">Saved internally</span>
                        </div>`,
                        540, 400);
                    const textarea = win.querySelector('#notepadText');
                    win._savePath = path;

                    win.querySelector('#npSaveBtn').addEventListener('click', () => {
                        if (VFS.writeFile(win._savePath, textarea.value)) {
                            alert('✅ Saved to: ' + win._savePath);
                        } else {
                            alert('❌ Save failed.');
                        }
                    });
                    win.querySelector('#npExportBtn').addEventListener('click', () => {
                        const blob = new Blob([textarea.value], { type: 'text/plain' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        a.click();
                        URL.revokeObjectURL(url);
                    });
                    break;
                }

                case 'calculator':
                    win = createWindow(appId, 'Calculator', '🧮',
                        `<input type="text" id="calcDisplay" readonly value="0" />
                        <div class="calc-grid">
                            <button data-val="7">7</button><button data-val="8">8</button><button data-val="9">9</button><button class="op" data-val="/">÷</button>
                            <button data-val="4">4</button><button data-val="5">5</button><button data-val="6">6</button><button class="op" data-val="*">×</button>
                            <button data-val="1">1</button><button data-val="2">2</button><button data-val="3">3</button><button class="op" data-val="-">−</button>
                            <button data-val="0">0</button><button data-val=".">.</button><button class="eq" data-val="=">=</button><button class="op" data-val="+">+</button>
                            <button style="grid-column: span 4; background:#d43a3a;" data-val="C">C</button>
                        </div>`,
                        320, 400);
                    initCalculator(win);
                    break;

                case 'camera':
                    win = createWindow(appId, 'Camera', '📷',
                        `<video id="camVideo" autoplay playsinline></video>
                        <div class="cam-controls">
                            <button class="primary" id="camCaptureBtn">📸 Capture</button>
                            <button id="camFlipBtn">🔄 Flip</button>
                            <button class="danger" id="camCloseBtn">✕ Close</button>
                        </div>
                        <div class="cam-gallery" id="camGallery"></div>`,
                        560, 480);
                    initCamera(win);
                    break;

                case 'microphone':
                    win = createWindow(appId, 'Microphone', '🎤',
                        `<canvas id="audioVisualizer"></canvas>
                        <div class="cam-controls">
                            <button class="primary" id="micStartBtn">▶ Start</button>
                            <button class="danger" id="micStopBtn">⏹ Stop</button>
                            <button id="micSaveBtn" style="background:#0078d4;border:none;color:white;padding:4px 16px;border-radius:4px;cursor:pointer;">💾 Save to Recordings</button>
                        </div>
                        <div class="mic-status" id="micStatus">Click "Start" to record.</div>`,
                        500, 340);
                    initMicrophone(win);
                    break;

                case 'appstore':
                    win = createWindow(appId, 'App Store', '🛒',
                        `<div style="flex:1;">
                            <div class="app-card"><div class="info"><span class="icon">🎬</span><div><div class="name">Videohub</div><div class="desc">Streaming platform</div></div></div><button class="launch-btn" id="launchVideohubBtn">Launch</button></div>
                            <div class="app-card"><div class="info"><span class="icon">🎮</span><div><div class="name">Game Center</div><div class="desc">Coming soon...</div></div></div><button class="launch-btn" style="opacity:0.5;cursor:default;">Soon</button></div>
                            <p style="color:#555;font-size:12px;margin-top:12px;">Apps are stored internally.</p>
                        </div>`,
                        480, 300);
                    win.querySelector('#launchVideohubBtn').addEventListener('click', () => launchApp('videohub'));
                    break;

                case 'videohub':
                    win = createWindow(appId, 'Videohub', '🎬',
                        `<iframe src="https://videohubpro.lovable.app" style="width:100%;height:100%;border:none;border-radius:4px;background:white;"></iframe>`,
                        820, 620);
                    break;

                case 'imageviewer':
                    win = createWindow('imageviewer', 'Image Viewer', '🖼️',
                        `<div class="image-viewer"><img src="${extraData}" alt="Image" /></div>`,
                        540, 420);
                    break;

                case 'settings':
                    win = createWindow(appId, 'Settings', '⚙️', `<div id="settingsContainer" style="flex:1;"></div>`, 560, 480);
                    setTimeout(() => renderSettings(win), 50);
                    break;

                default:
                    win = createWindow('unknown', 'Unknown', '❓', '<p>App not found.</p>', 300, 150);
            }
            if (win) win._appId = appId;
        }

        // ================================================================
        //  CALCULATOR
        // ================================================================
        function initCalculator(win) {
            const display = win.querySelector('#calcDisplay');
            let current = '';
            win.querySelectorAll('.calc-grid button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const val = btn.dataset.val;
                    if (val === 'C') { current = '';
                        display.value = '0'; return; }
                    if (val === '=') {
                        try {
                            const result = Function('"use strict"; return (' + current + ')')();
                            display.value = result;
                            current = String(result);
                        } catch { display.value = 'Error';
                            current = ''; }
                        return;
                    }
                    current += val;
                    display.value = current;
                });
            });
        }

        // ================================================================
        //  CAMERA
        // ================================================================
        let cameraFacing = 'user',
            cameraStream = null;

        function initCamera(win) {
            const video = win.querySelector('#camVideo');
            const gallery = win.querySelector('#camGallery');
            // Load existing photos from VFS
            const photos = VFS.listFolder('/Pictures') || [];
            photos.filter(f => f.type === 'file' && ['png', 'jpg', 'jpeg'].some(e => f.name.endsWith(e))).forEach(f => {
                const img = document.createElement('img');
                img.src = VFS.readFile('/Pictures/' + f.name);
                gallery.appendChild(img);
            });

            async function startCamera(facing) {
                if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); }
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing,
                            width: { ideal: 640 } } });
                    video.srcObject = cameraStream;
                    win._mediaStream = cameraStream;
                } catch { video.textContent = '❌ Camera access denied.';
                    video.style.display = 'flex';
                    video.style.alignItems = 'center';
                    video.style.justifyContent = 'center'; }
            }
            startCamera(cameraFacing);

            win.querySelector('#camCaptureBtn').addEventListener('click', () => {
                if (!cameraStream) return;
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const dataUrl = canvas.toDataURL('image/png');
                const name = 'photo_' + Date.now() + '.png';
                if (VFS.writeFile('/Pictures/' + name, dataUrl)) {
                    const img = document.createElement('img');
                    img.src = dataUrl;
                    gallery.prepend(img);
                    alert('✅ Saved to /Pictures/' + name);
                }
            });
            win.querySelector('#camFlipBtn').addEventListener('click', () => {
                cameraFacing = (cameraFacing === 'user') ? 'environment' : 'user';
                startCamera(cameraFacing);
            });
            win.querySelector('#camCloseBtn').addEventListener('click', () => closeWindow(win.id));
        }

        // ================================================================
        //  MICROPHONE
        // ================================================================
        function initMicrophone(win) {
            const canvas = win.querySelector('#audioVisualizer');
            const ctx = canvas.getContext('2d');
            const status = win.querySelector('#micStatus');
            let audioCtx = null,
                analyser = null,
                source = null,
                animFrame = null,
                micStream = null;
            let mediaRecorder = null,
                recordedChunks = [];

            function drawBars() {
                if (!analyser) return;
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(dataArray);
                const w = canvas.width,
                    h = canvas.height;
                ctx.clearRect(0, 0, w, h);
                const barWidth = (w / dataArray.length) * 2.5;
                for (let i = 0; i < dataArray.length; i++) {
                    const bh = (dataArray[i] / 255) * h;
                    ctx.fillStyle = `hsl(${i / dataArray.length * 240 + 200}, 80%, 50%)`;
                    ctx.fillRect(i * (barWidth + 1), h - bh, barWidth, bh);
                }
                animFrame = requestAnimationFrame(drawBars);
            }

            win.querySelector('#micStartBtn').addEventListener('click', async () => {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    win._mediaStream = micStream;
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    win._audioCtx = audioCtx;
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256;
                    source = audioCtx.createMediaStreamSource(micStream);
                    source.connect(analyser);
                    canvas.width = canvas.clientWidth * 2;
                    canvas.height = canvas.clientHeight * 2;
                    if (audioCtx.state === 'suspended') await audioCtx.resume();
                    recordedChunks = [];
                    mediaRecorder = new MediaRecorder(micStream);
                    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                    mediaRecorder.start(1000);
                    drawBars();
                    status.textContent = '🎤 Recording...';
                } catch { status.textContent = '❌ Microphone access denied.'; }
            });

            win.querySelector('#micStopBtn').addEventListener('click', () => {
                if (animFrame) cancelAnimationFrame(animFrame);
                if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                if (audioCtx) audioCtx.close();
                if (micStream) micStream.getTracks().forEach(t => t.stop());
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                status.textContent = '⏹ Stopped. Click "Save to Recordings".';
            });

            win.querySelector('#micSaveBtn').addEventListener('click', () => {
                if (recordedChunks.length === 0) { alert('Record something first!'); return; }
                const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64 = e.target.result;
                    const name = 'recording_' + Date.now() + '.webm';
                    if (VFS.writeFile('/Recordings/' + name, base64)) {
                        alert('✅ Saved to /Recordings/' + name);
                        status.textContent = '💾 Saved!';
                    } else { alert('Save failed.'); }
                };
                reader.readAsDataURL(blob);
            });
        }

        // ================================================================
        //  SETTINGS - MEGA PANEL
        // ================================================================
        function renderSettings(win) {
            const container = win.querySelector('#settingsContainer');
            const uptime = Math.floor((Date.now() - state.bootTime) / 1000);
            const days = Math.floor(uptime / 86400);
            const hours = Math.floor((uptime % 86400) / 3600);
            const mins = Math.floor((uptime % 3600) / 60);
            const uptimeStr = days > 0 ? `${days}d ${hours}h ${mins}m` : `${hours}h ${mins}m`;

            const mem = performance.memory ? (performance.memory.usedJSHeapSize / (1024 * 1024)).toFixed(1) : 'N/A';
            const totalMem = performance.memory ? (performance.memory.totalJSHeapSize / (1024 * 1024)).toFixed(1) : 'N/A';
            const cores = navigator.hardwareConcurrency || 'N/A';

            const vfsSize = (VFS.getTotalSize() / 1024).toFixed(1);
            const fileCount = VFS.getFileCount();

            const devName = localStorage.getItem('opencore_device_name') || 'Opencore-PC';
            const wallpaper = localStorage.getItem('opencore_wallpaper') || '#16213e';

            container.innerHTML = `
                <div class="settings-tabs">
                    <button class="active" data-tab="system">💻 System</button>
                    <button data-tab="personalize">🎨 Personalization</button>
                    <button data-tab="storage">💾 Storage</button>
                    <button data-tab="about">ℹ️ About</button>
                </div>
                <div class="settings-tab-content active" data-tab="system">
                    <div class="settings-row"><span class="label">Device Name</span><input type="text" id="devNameInput" value="${devName}" /><button class="btn" id="devNameSave">Rename</button></div>
                    <div class="settings-row"><span class="label">OS Version</span><span class="value">OpencoreOS v3.1</span></div>
                    <div class="settings-row"><span class="label">Architecture</span><span class="value">Web x64</span></div>
                    <div class="settings-row"><span class="label">Uptime</span><span class="value">${uptimeStr}</span></div>
                    <div class="settings-row"><span class="label">CPU Cores</span><span class="value">${cores}</span></div>
                    <div class="settings-row"><span class="label">Memory (Heap)</span><span class="value">${mem} MB / ${totalMem} MB</span></div>
                    <div class="settings-row"><span class="label">Display</span><span class="value">${window.innerWidth}x${window.innerHeight}</span></div>
                    <div class="settings-row"><span class="label">Pixel Ratio</span><span class="value">${window.devicePixelRatio}x</span></div>
                </div>
                <div class="settings-tab-content" data-tab="personalize">
                    <div class="settings-row"><span class="label">Wallpaper</span><input type="color" id="wallColor" value="${wallpaper.replace('#','')}" /><button class="btn" id="wallApply">Apply</button><button class="btn-secondary" id="wallReset">Reset</button></div>
                    <div class="settings-row"><span class="label">Theme</span><button class="btn-secondary" id="themeToggle">Toggle Dark/Light (Experimental)</button></div>
                </div>
                <div class="settings-tab-content" data-tab="storage">
                    <div class="settings-row"><span class="label">Total Files</span><span class="value">${fileCount}</span></div>
                    <div class="settings-row"><span class="label">Storage Used</span><span class="value">${vfsSize} KB</span></div>
                    <div class="settings-row"><span class="label">Notepad Data</span><button class="btn-secondary" id="clearNotepad">🗑️ Clear</button></div>
                    <div class="settings-row"><span class="label">Photos (Pictures)</span><button class="btn-secondary" id="clearPhotos">🗑️ Clear</button></div>
                    <div class="settings-row"><span class="label">Recordings</span><button class="btn-secondary" id="clearRecordings">🗑️ Clear</button></div>
                    <div class="settings-row"><button class="btn" id="clearAllVFS" style="background:#d43a3a;">⚠️ Delete ALL Files</button></div>
                </div>
                <div class="settings-tab-content" data-tab="about">
                    <div style="text-align:center;padding:20px;">
                        <div style="font-size:64px;">🪟</div>
                        <h2 style="font-weight:300;margin:10px 0;">OpencoreOS</h2>
                        <p style="color:#888;">Version 3.1 "Mega Update"</p>
                        <p style="color:#666;font-size:13px;margin-top:10px;">Built with HTML, CSS, JavaScript</p>
                        <p style="color:#555;font-size:12px;margin-top:4px;">Virtual File System • Single Instance Apps • Enterprise Settings</p>
                        <p style="color:#444;font-size:12px;margin-top:20px;">© 2026 OpencoreOS</p>
                    </div>
                </div>
            `;

            // Tab switching
            container.querySelectorAll('.settings-tabs button').forEach(tab => {
                tab.addEventListener('click', () => {
                    container.querySelectorAll('.settings-tabs button').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const target = tab.dataset.tab;
                    container.querySelectorAll('.settings-tab-content').forEach(c => c.classList.remove('active'));
                    container.querySelector(`.settings-tab-content[data-tab="${target}"]`).classList.add('active');
                });
            });

            // Device Name
            container.querySelector('#devNameSave').addEventListener('click', () => {
                const name = container.querySelector('#devNameInput').value.trim() || 'Opencore-PC';
                localStorage.setItem('opencore_device_name', name);
                document.querySelector('.user-name').textContent = name;
                alert('Device renamed to ' + name);
            });

            // Wallpaper
            container.querySelector('#wallApply').addEventListener('click', () => {
                const color = '#' + container.querySelector('#wallColor').value;
                const grad = `radial-gradient(ellipse at 20% 20%, ${color}, #0a0a1a)`;
                desktop.style.background = grad;
                localStorage.setItem('opencore_wallpaper', grad);
            });
            container.querySelector('#wallReset').addEventListener('click', () => {
                const grad = 'radial-gradient(ellipse at 20% 20%, #16213e, #0a0a1a)';
                desktop.style.background = grad;
                localStorage.setItem('opencore_wallpaper', grad);
                container.querySelector('#wallColor').value = '16213e';
            });

            // Theme toggle (visual only)
            container.querySelector('#themeToggle').addEventListener('click', () => {
                document.body.style.filter = document.body.style.filter === 'invert(1)' ? 'none' : 'invert(1)';
            });

            // Storage clear functions
            const clearFolder = (folder, msg) => {
                if (confirm(`Delete all files in /${folder}?`)) {
                    const entries = VFS.listFolder('/' + folder) || [];
                    entries.forEach(f => {
                        if (f.type === 'file') VFS.deleteEntry('/' + folder + '/' + f.name);
                    });
                    alert(msg || 'Cleared!');
                    renderSettings(win);
                }
            };
            container.querySelector('#clearNotepad').addEventListener('click', () => clearFolder('Documents', 'Notepad files cleared.'));
            container.querySelector('#clearPhotos').addEventListener('click', () => clearFolder('Pictures', 'Photos cleared.'));
            container.querySelector('#clearRecordings').addEventListener('click', () => clearFolder('Recordings',
            'Recordings cleared.'));

            container.querySelector('#clearAllVFS').addEventListener('click', () => {
                if (confirm('⚠️ Delete ALL files in the OS? This cannot be undone!')) {
                    if (confirm('Are you sure?')) {
                        const root = VFS.getRoot();
                        root.children = {
                            'Documents': { type: 'folder', children: {} },
                            'Pictures': { type: 'folder', children: {} },
                            'Recordings': { type: 'folder', children: {} },
                            'Desktop': { type: 'folder', children: {} },
                        };
                        VFS.saveRoot(root);
                        alert('All files deleted.');
                        renderSettings(win);
                    }
                }
            });
        }

        // ================================================================
        //  EVENT BINDINGS
        // ================================================================
        document.querySelectorAll('.desktop-icon').forEach(el => {
            el.addEventListener('dblclick', () => {
                const app = el.dataset.app;
                if (app) launchApp(app);
            });
        });

        document.querySelectorAll('.start-item').forEach(el => {
            el.addEventListener('click', () => {
                const app = el.dataset.app;
                if (app) { launchApp(app);
                    startMenu.classList.remove('open'); }
            });
        });

        document.getElementById('desktopRecycle').addEventListener('dblclick', () => {
            launchApp('explorer');
            setTimeout(() => {
                const win = state.windows.find(w => w.appId === 'explorer');
                if (win) {
                    // Just show empty
                    const body = win.element.querySelector('.window-body');
                    body.innerHTML =
                        `<p style="color:#666;text-align:center;padding:30px;">🗑️ Recycle Bin is empty.</p>`;
                }
            }, 200);
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'e') { e.preventDefault();
                launchApp('explorer'); }
            if (e.ctrlKey && e.key === 'n') { e.preventDefault();
                launchApp('notepad'); }
            if (e.ctrlKey && e.key === 'c') { e.preventDefault();
                launchApp('calculator'); }
            if (e.key === 'Escape' && state.windows.length > 0) {
                const last = state.windows[state.windows.length - 1];
                closeWindow(last.id);
            }
        });

        console.log('🪟 OpencoreOS v3.1 booted!');
        console.log('📁 Internal VFS: Your files are stored in the OS.');
        console.log('⚡ Single Instance Apps: No duplicates!');
        console.log('⚙️ Mega Settings with live performance stats.');
    </script>
</body>
</html>
