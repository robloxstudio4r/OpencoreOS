<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpencoreOS v4.0</title>
    <style>
        /* ===== RESET & VARIABLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }
        :root {
            --bg: #1a1a2e;
            --bg2: #16213e;
            --glass: rgba(28, 28, 48, 0.92);
            --border: rgba(255, 255, 255, 0.06);
            --text: #eee;
            --text2: #aaa;
            --accent: #0078d4;
            --shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            position: relative;
        }

        /* ===== SETUP WIZARD ===== */
        #setupWizard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a2e, #0a0a1a);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            transition: opacity 0.8s;
        }
        #setupWizard.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #setupWizard .logo {
            font-size: 72px;
        }
        #setupWizard h1 {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        #setupWizard .subtitle {
            color: #888;
            margin-bottom: 30px;
        }
        #setupWizard .progress-container {
            width: 400px;
            max-width: 80%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            height: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        #setupWizard .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #00b4d8);
            border-radius: 12px;
            transition: width 0.3s;
        }
        #setupWizard .status-text {
            margin-top: 14px;
            color: #aaa;
            font-size: 14px;
        }

        /* ===== DESKTOP ===== */
        #desktop {
            width: 100%;
            height: calc(100% - 50px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 20px;
            background: radial-gradient(ellipse at 20% 20%, var(--bg2), var(--bg));
            transition: background 0.5s;
        }
        .desktop-icon {
            width: 85px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: white;
            font-size: 13px;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            transition: background 0.2s, transform 0.1s;
            background: transparent;
            border: none;
        }
        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.02);
        }
        .desktop-icon .icon {
            font-size: 48px;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
        }
        .desktop-icon .label {
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
            font-size: 12px;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        /* ===== TASKBAR ===== */
        #taskbar {
            height: 50px;
            background: rgba(20, 20, 40, 0.88);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 6px;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.4);
        }
        #start-btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: white;
            padding: 4px 14px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
            height: 34px;
            border: 1px solid var(--border);
        }
        #start-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .taskbar-apps {
            display: flex;
            gap: 2px;
            flex: 1;
            padding: 0 8px;
            overflow-x: auto;
            align-items: center;
        }
        .taskbar-app {
            background: transparent;
            border: none;
            color: #ccc;
            padding: 4px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s;
            height: 32px;
            white-space: nowrap;
            border: 1px solid transparent;
        }
        .taskbar-app:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .taskbar-app.active {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border-color: var(--border);
        }
        #systemTray {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #aaa;
            font-size: 13px;
            padding: 0 6px;
        }
        #systemTray .tray-icon {
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.15s;
            position: relative;
        }
        #systemTray .tray-icon:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        #batteryIcon {
            font-size: 18px;
        }
        #clock {
            color: white;
            font-size: 13px;
            padding: 0 6px;
            min-width: 80px;
            text-align: center;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
        }

        /* ===== START MENU ===== */
        #start-menu {
            position: fixed;
            bottom: 56px;
            left: 8px;
            width: 360px;
            background: rgba(22, 22, 40, 0.96);
            backdrop-filter: blur(24px);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: none;
            z-index: 10000;
            box-shadow: 0 16px 60px rgba(0, 0, 0, 0.7);
            max-height: 450px;
            overflow-y: auto;
        }
        #start-menu.open {
            display: block;
        }
        #start-menu .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 10px;
        }
        #start-menu .header .user-icon {
            font-size: 32px;
        }
        #start-menu .header .user-name {
            color: white;
            font-weight: 500;
            font-size: 16px;
        }
        #start-menu .header .user-status {
            color: #666;
            font-size: 12px;
        }
        #start-menu .section {
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 4px 4px 4px;
        }
        .start-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: #ddd;
            transition: background 0.12s;
            font-size: 14px;
        }
        .start-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: white;
        }
        .start-item .icon {
            font-size: 20px;
            width: 28px;
            text-align: center;
        }

        /* ===== WINDOWS ===== */
        .window {
            position: absolute;
            min-width: 340px;
            min-height: 200px;
            background: var(--glass);
            backdrop-filter: blur(16px);
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: windowIn 0.2s ease;
        }
        @keyframes windowIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .window-header {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            min-height: 44px;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .window-controls {
            display: flex;
            gap: 6px;
        }
        .window-controls button {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            transition: background 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
        }
        .window-controls .close-btn:hover {
            background: #e81123;
            color: white;
        }
        .window-controls .max-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: white;
        }
        .window-controls .min-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: white;
        }
        .window-body {
            flex: 1;
            padding: 16px;
            color: var(--text);
            overflow: auto;
            font-size: 14px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        /* ===== BROWSER ===== */
        .browser-toolbar {
            display: flex;
            gap: 6px;
            padding: 6px 0 12px 0;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
            margin-bottom: 10px;
        }
        .browser-toolbar button {
            background: rgba(255, 255, 255, 0.04);
            border: none;
            color: #ccc;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .browser-toolbar button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .browser-toolbar input {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
            min-width: 100px;
        }
        .browser-toolbar input:focus {
            border-color: var(--accent);
        }
        .browser-frame {
            flex: 1;
            width: 100%;
            border: none;
            border-radius: 4px;
            background: white;
            min-height: 300px;
        }

        /* ===== TERMINAL ===== */
        .terminal-output {
            background: #0a0a1a;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            color: #0f0;
            flex: 1;
            min-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid var(--border);
        }
        .terminal-output .error {
            color: #ff6b6b;
        }
        .terminal-output .success {
            color: #51cf66;
        }
        .terminal-output .info {
            color: #4dabf7;
        }
        .terminal-input-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            align-items: center;
        }
        .terminal-input-row span {
            color: #0f0;
            font-family: 'Consolas', monospace;
            font-size: 14px;
        }
        .terminal-input-row input {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            color: #0f0;
            padding: 4px 10px;
            border-radius: 4px;
            outline: none;
            font-family: 'Consolas', monospace;
            font-size: 14px;
        }
        .terminal-input-row input:focus {
            border-color: var(--accent);
        }

        /* ===== TASK MANAGER ===== */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .task-item .name {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .task-item .kill-btn {
            background: #d43a3a;
            border: none;
            color: white;
            padding: 2px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .task-item .kill-btn:hover {
            background: #b02b2b;
        }

        /* ===== MUSIC APP ===== */
        .music-search-row {
            display: flex;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .music-search-row input {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
            min-width: 150px;
        }
        .music-search-row input:focus {
            border-color: var(--accent);
        }
        .music-search-row button {
            background: var(--accent);
            border: none;
            color: white;
            padding: 4px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.15s;
        }
        .music-search-row button:hover {
            background: #106ebe;
        }
        .music-results {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
        }
        .music-result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
        }
        .music-result-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .music-result-item .info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .music-result-item .info img {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
        }
        .music-result-item .info .title {
            font-weight: 500;
        }
        .music-result-item .info .artist {
            color: #888;
            font-size: 13px;
        }
        .music-player-embed {
            margin-top: 12px;
            border-radius: 8px;
            overflow: hidden;
            background: #0a0a1a;
        }
        .music-player-embed iframe {
            width: 100%;
            height: 80px;
            border: none;
        }

        /* ===== SETTINGS (new network/bluetooth) ===== */
        .settings-tabs {
            display: flex;
            gap: 2px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .settings-tabs button {
            background: transparent;
            border: none;
            color: #888;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
        }
        .settings-tabs button:hover {
            color: white;
        }
        .settings-tabs button.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .settings-tab-content {
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        .settings-tab-content.active {
            display: flex;
        }
        .settings-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .settings-row .label {
            color: var(--text2);
            min-width: 100px;
            font-size: 14px;
        }
        .settings-row .value {
            color: white;
            font-size: 14px;
            flex: 1;
        }
        .settings-row input[type="color"] {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
            padding: 0;
        }
        .settings-row input[type="text"] {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
            width: 150px;
        }
        .settings-row input[type="text"]:focus {
            border-color: var(--accent);
        }
        .settings-row .btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 4px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 13px;
        }
        .settings-row .btn:hover {
            background: #106ebe;
        }
        .settings-row .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #ccc;
            padding: 4px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 13px;
        }
        .settings-row .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .settings-row .toggle {
            position: relative;
            width: 40px;
            height: 22px;
            background: #444;
            border-radius: 11px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .settings-row .toggle.on {
            background: var(--accent);
        }
        .settings-row .toggle .slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        .settings-row .toggle.on .slider {
            transform: translateX(18px);
        }

        /* ===== FILE EXPLORER (VFS) ===== */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            padding: 4px;
        }
        .file-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            border: 1px solid transparent;
            text-align: center;
            color: #ccc;
            font-size: 12px;
        }
        .file-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border);
        }
        .file-item .icon {
            font-size: 32px;
            margin-bottom: 4px;
        }
        .file-item .name {
            word-break: break-all;
            line-height: 1.2;
            max-width: 80px;
            font-size: 11px;
        }
        .file-item.folder .icon {
            color: #ffd700;
        }
        .file-item.image .icon {
            color: #4fc3f7;
        }
        .file-item.text .icon {
            color: #81c784;
        }
        .file-item.audio .icon {
            color: #ff8a65;
        }
        .file-toolbar {
            display: flex;
            gap: 8px;
            padding: 6px 0 12px 0;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
            align-items: center;
        }
        .file-toolbar button {
            background: rgba(255, 255, 255, 0.04);
            border: none;
            color: #ccc;
            padding: 4px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s;
        }
        .file-toolbar button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .file-toolbar .path-display {
            color: #666;
            font-size: 12px;
            flex: 1;
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>

    <!-- ===== SETUP WIZARD ===== -->
    <div id="setupWizard">
        <div class="logo">🪟</div>
        <h1>OpencoreOS</h1>
        <div class="subtitle">Preparing your system...</div>
        <div class="progress-container"><div class="progress-bar" id="setupProgress"></div></div>
        <div class="status-text" id="setupStatus">Initializing...</div>
    </div>

    <!-- ===== DESKTOP ===== -->
    <div id="desktop">
        <button class="desktop-icon" data-app="explorer"><span class="icon">📁</span><span class="label">Files</span></button>
        <button class="desktop-icon" data-app="browser"><span class="icon">🌐</span><span class="label">Browser</span></button>
        <button class="desktop-icon" data-app="notepad"><span class="icon">📝</span><span class="label">Notepad</span></button>
        <button class="desktop-icon" data-app="camera"><span class="icon">📷</span><span class="label">Camera</span></button>
        <button class="desktop-icon" data-app="microphone"><span class="icon">🎤</span><span class="label">Microphone</span></button>
        <button class="desktop-icon" data-app="music"><span class="icon">🎵</span><span class="label">Music</span></button>
        <button class="desktop-icon" data-app="terminal"><span class="icon">💻</span><span class="label">Terminal</span></button>
        <button class="desktop-icon" data-app="taskmanager"><span class="icon">📊</span><span class="label">Task Manager</span></button>
        <button class="desktop-icon" data-app="appstore"><span class="icon">🛒</span><span class="label">App Store</span></button>
        <button class="desktop-icon" data-app="calculator"><span class="icon">🧮</span><span class="label">Calculator</span></button>
        <button class="desktop-icon" data-app="settings"><span class="icon">⚙️</span><span class="label">Settings</span></button>
        <button class="desktop-icon" id="desktopRecycle"><span class="icon">🗑️</span><span class="label">Recycle Bin</span></button>
    </div>

    <!-- ===== START MENU ===== -->
    <div id="start-menu">
        <div class="header"><span class="user-icon">👤</span><div><div class="user-name">Opencore User</div><div class="user-status">System ready</div></div></div>
        <div class="section">📌 Pinned</div>
        <div class="start-item" data-app="explorer"><span class="icon">📁</span> File Explorer</div>
        <div class="start-item" data-app="browser"><span class="icon">🌐</span> Web Browser</div>
        <div class="start-item" data-app="notepad"><span class="icon">📝</span> Notepad</div>
        <div class="start-item" data-app="music"><span class="icon">🎵</span> Music</div>
        <div class="start-item" data-app="terminal"><span class="icon">💻</span> Terminal</div>
        <div class="section">🎯 All Apps</div>
        <div class="start-item" data-app="camera"><span class="icon">📷</span> Camera</div>
        <div class="start-item" data-app="microphone"><span class="icon">🎤</span> Microphone</div>
        <div class="start-item" data-app="taskmanager"><span class="icon">📊</span> Task Manager</div>
        <div class="start-item" data-app="appstore"><span class="icon">🛒</span> App Store</div>
        <div class="start-item" data-app="calculator"><span class="icon">🧮</span> Calculator</div>
        <div class="start-item" data-app="settings"><span class="icon">⚙️</span> Settings</div>
        <div class="start-item" id="shutdownBtn"><span class="icon">⏻</span> Restart OS</div>
    </div>

    <!-- ===== TASKBAR ===== -->
    <div id="taskbar">
        <button id="start-btn">🪟 Start</button>
        <div class="taskbar-apps" id="taskbarApps"></div>
        <div id="systemTray">
            <span class="tray-icon" id="batteryIcon">🔋</span>
            <span class="tray-icon" title="Network">📶</span>
            <span class="tray-icon" title="Sound">🔊</span>
        </div>
        <div id="clock">00:00:00</div>
    </div>

    <script>
        // ================================================================
        //  OPENCOREOS v4.0 - THE MEGA ULTIMATE EDITION
        //  Features: Browser, Terminal, Task Manager, .oc files, Battery,
        //  Network/Bluetooth management, Music app with Spotify
        // ================================================================

        // ---------- STATE ----------
        const state = {
            windows: [],
            nextZIndex: 100,
            windowCounter: 0,
            bootTime: Date.now(),
            terminalHistory: [],
            browserHistory: [],
            browserIndex: -1,
        };

        // ---------- DOM REFS ----------
        const desktop = document.getElementById('desktop');
        const startMenu = document.getElementById('start-menu');
        const startBtn = document.getElementById('start-btn');
        const clockEl = document.getElementById('clock');
        const taskbarApps = document.getElementById('taskbarApps');
        const batteryIcon = document.getElementById('batteryIcon');
        const setupWizard = document.getElementById('setupWizard');
        const setupProgress = document.getElementById('setupProgress');
        const setupStatus = document.getElementById('setupStatus');

        // ================================================================
        //  VIRTUAL FILE SYSTEM (VFS) WITH .oc SUPPORT
        // ================================================================
        const VFS = {
            init() {
                if (!localStorage.getItem('opencore_vfs')) {
                    const root = {
                        type: 'folder',
                        children: {
                            'Documents': { type: 'folder', children: {} },
                            'Pictures': { type: 'folder', children: {} },
                            'Recordings': { type: 'folder', children: {} },
                            'Desktop': { type: 'folder', children: {} },
                            'readme.txt': {
                                type: 'file',
                                content: 'Welcome to OpencoreOS v4.0!\n\n.oc files are wrappers that store any file type.'
                            }
                        }
                    };
                    localStorage.setItem('opencore_vfs', JSON.stringify(root));
                }
            },
            getRoot() {
                return JSON.parse(localStorage.getItem('opencore_vfs'));
            },
            saveRoot(root) {
                localStorage.setItem('opencore_vfs', JSON.stringify(root));
            },
            getNode(path) {
                const parts = path.split('/').filter(p => p);
                let node = this.getRoot();
                for (const part of parts) {
                    if (!node.children || !node.children[part]) return null;
                    node = node.children[part];
                }
                return node;
            },
            readFile(path) {
                const node = this.getNode(path);
                if (!node || node.type !== 'file') return null;
                // Check if .oc file
                if (path.endsWith('.oc')) {
                    try {
                        const parsed = JSON.parse(node.content);
                        return parsed; // { type, content, metadata }
                    } catch {
                        return node.content;
                    }
                }
                return node.content;
            },
            writeFile(path, content) {
                const parts = path.split('/').filter(p => p);
                const fileName = parts.pop();
                const root = this.getRoot();
                let node = root;
                for (const part of parts) {
                    if (!node.children[part]) {
                        node.children[part] = { type: 'folder', children: {} };
                    }
                    node = node.children[part];
                }
                node.children[fileName] = { type: 'file', content: content };
                this.saveRoot(root);
                return true;
            },
            // Write a .oc wrapper file
            writeOCFile(path, originalType, data, metadata = {}) {
                const wrapper = JSON.stringify({
                    type: originalType,
                    content: data,
                    metadata: metadata,
                    _oc: true
                });
                return this.writeFile(path, wrapper);
            },
            listFolder(path) {
                const node = this.getNode(path);
                if (!node || node.type !== 'folder') return null;
                return Object.keys(node.children).map(name => ({
                    name,
                    ...node.children[name]
                }));
            },
            createFolder(path) {
                const parts = path.split('/').filter(p => p);
                const folderName = parts.pop();
                const root = this.getRoot();
                let node = root;
                for (const part of parts) {
                    if (!node.children[part]) {
                        node.children[part] = { type: 'folder', children: {} };
                    }
                    node = node.children[part];
                }
                if (!node.children[folderName]) {
                    node.children[folderName] = { type: 'folder', children: {} };
                    this.saveRoot(root);
                    return true;
                }
                return false;
            },
            deleteEntry(path) {
                const parts = path.split('/').filter(p => p);
                const name = parts.pop();
                const root = this.getRoot();
                let node = root;
                for (const part of parts) {
                    if (!node.children[part]) return false;
                    node = node.children[part];
                }
                if (node.children[name]) {
                    delete node.children[name];
                    this.saveRoot(root);
                    return true;
                }
                return false;
            },
            getTotalSize() {
                const root = this.getRoot();
                const calc = (node) => {
                    let size = 0;
                    if (node.type === 'file') {
                        return new Blob([node.content || '']).size;
                    }
                    if (node.children) {
                        for (const key in node.children) {
                            size += calc(node.children[key]);
                        }
                    }
                    return size;
                };
                return calc(root);
            },
            getFileCount() {
                const root = this.getRoot();
                let count = 0;
                const walk = (node) => {
                    if (node.type === 'file') count++;
                    if (node.children) {
                        for (const key in node.children) {
                            walk(node.children[key]);
                        }
                    }
                };
                walk(root);
                return count;
            },
            // Resolve .oc file to original content and type
            resolveOCFile(path) {
                const data = this.readFile(path);
                if (typeof data === 'object' && data._oc) {
                    return data;
                }
                return null;
            }
        };
        VFS.init();

        // ================================================================
        //  SETUP WIZARD
        // ================================================================
        function runSetupWizard() {
            const steps = ['Formatting virtual drive...', 'Creating system folders...', 'Installing core components...',
                'Configuring user settings...', 'Optimizing performance...', 'Finalizing setup...'
            ];
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 3 + 1;
                if (progress > 100) progress = 100;
                setupProgress.style.width = progress + '%';
                const idx = Math.min(Math.floor(progress / 17), steps.length - 1);
                setupStatus.textContent = steps[idx] || 'Almost ready...';
                if (progress >= 100) {
                    clearInterval(interval);
                    setupStatus.textContent = '✅ Installation complete!';
                    setTimeout(() => {
                        setupWizard.classList.add('hidden');
                        localStorage.setItem('opencore_setup_done', 'true');
                        loadSavedSettings();
                        updateClock();
                        setInterval(updateClock, 1000);
                        updateBattery();
                        setInterval(updateBattery, 30000);
                    }, 600);
                }
            }, 1200);
        }
        if (localStorage.getItem('opencore_setup_done') === 'true') {
            setupWizard.classList.add('hidden');
            loadSavedSettings();
            updateClock();
            setInterval(updateClock, 1000);
            updateBattery();
            setInterval(updateBattery, 30000);
        } else {
            runSetupWizard();
        }

        // ================================================================
        //  BATTERY
        // ================================================================
        async function updateBattery() {
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    const level = Math.round(battery.level * 100);
                    const charging = battery.charging;
                    batteryIcon.textContent = charging ? '⚡' : '🔋';
                    batteryIcon.title = `${level}% ${charging ? '(Charging)' : ''}`;
                } catch {}
            }
        }

        // ================================================================
        //  SAVED SETTINGS
        // ================================================================
        function loadSavedSettings() {
            const wallpaper = localStorage.getItem('opencore_wallpaper');
            if (wallpaper) desktop.style.background = wallpaper;
            const devName = localStorage.getItem('opencore_device_name') || 'Opencore-PC';
            document.querySelector('.user-name').textContent = devName;
        }

        // ================================================================
        //  CLOCK
        // ================================================================
        function updateClock() {
            const now = new Date();
            clockEl.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        // ================================================================
        //  START MENU
        // ================================================================
        startBtn.addEventListener('click', (e) => { e.stopPropagation();
            startMenu.classList.toggle('open'); });
        document.addEventListener('click', () => startMenu.classList.remove('open'));
        document.getElementById('shutdownBtn').addEventListener('click', () => {
            if (confirm('Restart OpencoreOS?')) location.reload();
        });

        // ================================================================
        //  WINDOW MANAGER (SINGLE INSTANCE)
        // ================================================================
        function createWindow(appId, title, icon, contentHTML, width = 520, height = 360) {
            const existing = state.windows.find(w => w.appId === appId);
            if (existing) {
                if (existing.minimized) { existing.minimized = false;
                    existing.element.style.display = 'flex';
                    updateTaskbar(); }
                focusWindow(existing.id);
                return existing.element;
            }
            const id = `win-${++state.windowCounter}`;
            const zIndex = ++state.nextZIndex;
            const win = document.createElement('div');
            win.className = 'window';
            win.id = id;
            win.style.width = width + 'px';
            win.style.height = height + 'px';
            const left = Math.max(10, Math.min(window.innerWidth - width - 20, 30 + (state.windows.length % 6) * 35));
            const top = Math.max(10, Math.min(window.innerHeight - height - 70, 30 + (state.windows.length % 6) * 25));
            win.style.left = left + 'px';
            win.style.top = top + 'px';
            win.style.zIndex = zIndex;
            win.innerHTML = `
                <div class="window-header">
                    <span class="window-title">${icon} ${title}</span>
                    <div class="window-controls">
                        <button class="min-btn" title="Minimize">─</button>
                        <button class="max-btn" title="Maximize">⬜</button>
                        <button class="close-btn" title="Close">✕</button>
                    </div>
                </div>
                <div class="window-body">${contentHTML}</div>
            `;
            document.body.appendChild(win);
            const header = win.querySelector('.window-header');
            let isDragging = false,
                offsetX, offsetY;
            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('.window-controls')) return;
                isDragging = true;
                const rect = win.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                win.style.zIndex = ++state.nextZIndex;
                win.style.cursor = 'grabbing';
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                let x = e.clientX - offsetX,
                    y = e.clientY - offsetY;
                x = Math.max(0, Math.min(window.innerWidth - 100, x));
                y = Math.max(0, Math.min(window.innerHeight - 80, y));
                win.style.left = x + 'px';
                win.style.top = y + 'px';
            });
            document.addEventListener('mouseup', () => { if (isDragging) { isDragging = false;
                    win.style.cursor = 'default'; } });
            win.querySelector('.close-btn').addEventListener('click', () => closeWindow(id));
            win.querySelector('.max-btn').addEventListener('click', () => toggleMaximize(id));
            win.querySelector('.min-btn').addEventListener('click', () => minimizeWindow(id));
            win.addEventListener('mousedown', () => { win.style.zIndex = ++state.nextZIndex; });
            state.windows.push({ id, appId, element: win, minimized: false });
            updateTaskbar();
            return win;
        }

        function closeWindow(id) {
            const idx = state.windows.findIndex(w => w.id === id);
            if (idx === -1) return;
            const win = state.windows[idx].element;
            if (win._mediaStream) win._mediaStream.getTracks().forEach(t => t.stop());
            if (win._animFrame) cancelAnimationFrame(win._animFrame);
            if (win._audioCtx) win._audioCtx.close();
            win.remove();
            state.windows.splice(idx, 1);
            updateTaskbar();
        }

        function toggleMaximize(id) {
            const win = state.windows.find(w => w.id === id);
            if (!win) return;
            const el = win.element;
            if (el.style.width === window.innerWidth - 4 + 'px') {
                el.style.width = '520px';
                el.style.height = '360px';
                el.style.left = '40px';
                el.style.top = '40px';
                el.style.borderRadius = '10px';
            } else {
                el.dataset.prevRect = JSON.stringify({ left: el.style.left, top: el.style.top, width: el.style.width,
                    height: el.style.height });
                el.style.width = window.innerWidth - 4 + 'px';
                el.style.height = window.innerHeight - 54 + 'px';
                el.style.left = '0px';
                el.style.top = '0px';
                el.style.borderRadius = '0';
            }
        }

        function minimizeWindow(id) {
            const win = state.windows.find(w => w.id === id);
            if (!win) return;
            win.minimized = !win.minimized;
            win.element.style.display = win.minimized ? 'none' : 'flex';
            updateTaskbar();
        }

        function focusWindow(id) {
            const win = state.windows.find(w => w.id === id);
            if (win) {
                win.element.style.zIndex = ++state.nextZIndex;
                if (win.minimized) { win.minimized = false;
                    win.element.style.display = 'flex';
                    updateTaskbar(); }
            }
        }

        function updateTaskbar() {
            taskbarApps.innerHTML = '';
            state.windows.forEach(w => {
                const btn = document.createElement('button');
                btn.className = 'taskbar-app' + (w.minimized ? '' : ' active');
                btn.textContent = w.element.querySelector('.window-title')?.textContent || 'App';
                btn.dataset.winId = w.id;
                btn.addEventListener('click', () => {
                    if (w.minimized) { w.minimized = false;
                        w.element.style.display = 'flex';
                        updateTaskbar(); } else { minimizeWindow(w.id); }
                    focusWindow(w.id);
                });
                taskbarApps.appendChild(btn);
            });
        }

        // ================================================================
        //  VFS FILE EXPLORER (with .oc support)
        // ================================================================
        let currentVFSPath = '/';

        function renderFileExplorer(win, path) {
            const body = win.querySelector('.window-body');
            const entries = VFS.listFolder(path);
            const displayPath = path === '/' ? 'Root' : path;
            let html = `
                <div class="file-toolbar">
                    <button id="vfsBackBtn">⬅ Back</button>
                    <button id="vfsHomeBtn">🏠 Home</button>
                    <button id="vfsNewFolderBtn">📁 New Folder</button>
                    <button id="vfsNewFileBtn">📄 New File</button>
                    <button id="vfsNewOCBtn">📦 New .oc File</button>
                    <span class="path-display">📂 ${displayPath}</span>
                </div>
                <div class="file-grid" id="vfsGrid">
            `;
            if (entries && entries.length > 0) {
                const sorted = entries.sort((a, b) => {
                    if (a.type === 'folder' && b.type !== 'folder') return -1;
                    if (a.type !== 'folder' && b.type === 'folder') return 1;
                    return a.name.localeCompare(b.name);
                });
                for (const entry of sorted) {
                    const isFolder = entry.type === 'folder';
                    let icon = isFolder ? '📁' : getVFSFileIcon(entry.name);
                    const cls = isFolder ? 'file-item folder' : 'file-item';
                    const name = entry.name.length > 18 ? entry.name.slice(0, 15) + '…' : entry.name;
                    html += `
                        <div class="${cls}" data-name="${entry.name}" data-type="${entry.type}">
                            <span class="icon">${icon}</span>
                            <span class="name">${name}</span>
                        </div>
                    `;
                }
            } else {
                html += `<p style="color:#666;padding:20px;text-align:center;">📂 This folder is empty.</p>`;
            }
            html += `</div>`;
            body.innerHTML = html;

            body.querySelectorAll('.file-item').forEach(el => {
                el.addEventListener('dblclick', () => {
                    const name = el.dataset.name;
                    const type = el.dataset.type;
                    const newPath = path === '/' ? '/' + name : path + '/' + name;
                    if (type === 'folder') {
                        currentVFSPath = newPath;
                        renderFileExplorer(win, newPath);
                    } else {
                        openFileByExtension(win, newPath, name);
                    }
                });
            });

            body.querySelector('#vfsBackBtn').addEventListener('click', () => {
                if (path !== '/') {
                    const parent = path.split('/').slice(0, -1).join('/') || '/';
                    currentVFSPath = parent;
                    renderFileExplorer(win, parent);
                }
            });
            body.querySelector('#vfsHomeBtn').addEventListener('click', () => {
                currentVFSPath = '/';
                renderFileExplorer(win, '/');
            });
            body.querySelector('#vfsNewFolderBtn').addEventListener('click', () => {
                const name = prompt('New folder name:');
                if (name) {
                    const newPath = path === '/' ? '/' + name : path + '/' + name;
                    if (VFS.createFolder(newPath)) renderFileExplorer(win, path);
                    else alert('Folder exists or invalid name.');
                }
            });
            body.querySelector('#vfsNewFileBtn').addEventListener('click', () => {
                const name = prompt('New file name (e.g., note.txt):');
                if (name) {
                    const newPath = path === '/' ? '/' + name : path + '/' + name;
                    if (VFS.writeFile(newPath, '')) renderFileExplorer(win, path);
                    else alert('Failed.');
                }
            });
            body.querySelector('#vfsNewOCBtn').addEventListener('click', () => {
                const name = prompt('New .oc file name (e.g., doc.oc):');
                if (name && name.endsWith('.oc')) {
                    const newPath = path === '/' ? '/' + name : path + '/' + name;
                    const originalType = prompt('Original file type (txt, png, jpg, wav, etc.):') || 'txt';
                    const content = prompt('Content (text for txt, or base64 for images):') || 'Sample content';
                    if (VFS.writeOCFile(newPath, originalType, content)) {
                        renderFileExplorer(win, path);
                        alert('✅ .oc file created!');
                    } else alert('Failed.');
                } else alert('Name must end with .oc');
            });
        }

        function openFileByExtension(win, path, name) {
            const ext = name.split('.').pop().toLowerCase();
            // Check if .oc file
            if (ext === 'oc') {
                const resolved = VFS.resolveOCFile(path);
                if (resolved) {
                    const { type, content } = resolved;
                    // Open based on original type
                    if (type === 'txt' || type === 'text' || type === 'md' || type === 'json' || type === 'js' || type ===
                        'html' || type === 'css' || type === 'xml') {
                        launchApp('notepad', { path, content });
                    } else if (['png', 'jpg', 'jpeg', 'gif', 'bmp', 'svg', 'webp'].includes(type)) {
                        launchApp('imageviewer', content);
                    } else if (['wav', 'mp3', 'ogg'].includes(type)) {
                        alert('🎵 Audio .oc file: would play here.');
                    } else {
                        alert(`📦 .oc file (${type}): ${content.slice(0, 100)}`);
                    }
                } else {
                    alert('Invalid .oc file.');
                }
                return;
            }

            // Regular file
            const content = VFS.readFile(path);
            if (content === null) { alert('Could not read file.'); return; }
            if (['png', 'jpg', 'jpeg', 'gif', 'bmp', 'svg', 'webp'].includes(ext)) {
                launchApp('imageviewer', content);
            } else if (['txt', 'md', 'json', 'js', 'html', 'css', 'xml'].includes(ext)) {
                launchApp('notepad', { path, content });
            } else if (['wav', 'mp3', 'ogg'].includes(ext)) {
                alert('🎵 Audio: ' + name);
            } else {
                alert('📄 File: ' + name + '\nContent length: ' + content.length);
            }
        }

        function getVFSFileIcon(name) {
            const ext = name.split('.').pop().toLowerCase();
            if (ext === 'oc') return '📦';
            const icons = {
                'png': '🖼️',
                'jpg': '🖼️',
                'jpeg': '🖼️',
                'gif': '🖼️',
                'svg': '🖼️',
                'webp': '🖼️',
                'txt': '📄',
                'md': '📄',
                'json': '📄',
                'js': '📄',
                'html': '🌐',
                'css': '🎨',
                'xml': '📄',
                'pdf': '📕',
                'doc': '📘',
                'mp3': '🎵',
                'wav': '🎵',
                'mp4': '🎬',
            };
            return icons[ext] || '📄';
        }

        // ================================================================
        //  APP LAUNCHER
        // ================================================================
        function launchApp(appId, extraData) {
            const existing = state.windows.find(w => w.appId === appId);
            if (existing) {
                if (existing.minimized) { existing.minimized = false;
                    existing.element.style.display = 'flex';
                    updateTaskbar(); }
                focusWindow(existing.id);
                return;
            }

            let win;
            switch (appId) {
                case 'explorer':
                    win = createWindow(appId, 'File Explorer', '📁', '', 640, 420);
                    setTimeout(() => { currentVFSPath = '/';
                        renderFileExplorer(win, '/'); }, 50);
                    break;

                case 'browser':
                    win = createWindow(appId, 'Browser', '🌐', `
                        <div class="browser-toolbar">
                            <button id="browserBack">◀</button>
                            <button id="browserForward">▶</button>
                            <button id="browserRefresh">⟳</button>
                            <button id="browserHome">🏠</button>
                            <input type="text" id="browserUrl" placeholder="Enter URL (https://...)" value="https://example.com" />
                            <button id="browserGo">Go</button>
                        </div>
                        <iframe class="browser-frame" id="browserFrame" src="https://example.com" sandbox="allow-scripts allow-forms allow-same-origin allow-popups"></iframe>
                    `, 780, 520);
                    initBrowser(win);
                    break;

                case 'terminal':
                    win = createWindow(appId, 'Terminal', '💻', `
                        <div class="terminal-output" id="termOutput"></div>
                        <div class="terminal-input-row">
                            <span>$</span>
                            <input type="text" id="termInput" placeholder="Enter command..." autofocus />
                        </div>
                    `, 600, 400);
                    initTerminal(win);
                    break;

                case 'taskmanager':
                    win = createWindow(appId, 'Task Manager', '📊', `
                        <div style="display:flex;gap:20px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px;">
                            <div><span style="color:#888;">CPU: </span><span id="tmCpu">0%</span></div>

        // ================================================================
        //  BROWSER
        // ================================================================
        function initBrowser(win) {
            const urlInput = win.querySelector('#browserUrl');
            const frame = win.querySelector('#browserFrame');
            const backBtn = win.querySelector('#browserBack');
            const forwardBtn = win.querySelector('#browserForward');
            const refreshBtn = win.querySelector('#browserRefresh');
            const homeBtn = win.querySelector('#browserHome');
            const goBtn = win.querySelector('#browserGo');

            function loadUrl(url) {
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }
                try {
                    frame.src = url;
                    urlInput.value = url;
                    state.browserHistory.push(url);
                    state.browserIndex = state.browserHistory.length - 1;
                } catch {
                    alert('Invalid URL');
                }
            }

            goBtn.addEventListener('click', () => loadUrl(urlInput.value));
            urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadUrl(urlInput.value); });
            backBtn.addEventListener('click', () => {
                if (state.browserIndex > 0) {
                    state.browserIndex--;
                    const url = state.browserHistory[state.browserIndex];
                    frame.src = url;
                    urlInput.value = url;
                }
            });
            forwardBtn.addEventListener('click', () => {
                if (state.browserIndex < state.browserHistory.length - 1) {
                    state.browserIndex++;
                    const url = state.browserHistory[state.browserIndex];
                    frame.src = url;
                    urlInput.value = url;
                }
            });
            refreshBtn.addEventListener('click', () => { frame.src = frame.src; });
            homeBtn.addEventListener('click', () => loadUrl('https://example.com'));
            // Load default
            setTimeout(() => loadUrl('https://example.com'), 100);
        }

        // ================================================================
        //  TERMINAL
        // ================================================================
        function initTerminal(win) {
            const output = win.querySelector('#termOutput');
            const input = win.querySelector('#termInput');
            let cwd = '/';

            function printLine(text, cls = '') {
                output.innerHTML += `<div class="${cls}">${text}</div>`;
                output.scrollTop = output.scrollHeight;
            }

            function processCommand(cmd) {
                const parts = cmd.trim().split(/\s+/);
                const command = parts[0];
                const args = parts.slice(1);
                printLine(`$ ${cmd}`, 'info');

                switch (command) {
                    case 'help':
                        printLine('Available commands: ls, cd, mkdir, touch, cat, echo, rm, clear, uptime, whoami, date, pwd, help');
                        break;
                    case 'ls': {
                        const entries = VFS.listFolder(cwd) || [];
                        const names = entries.map(e => e.type === 'folder' ? e.name + '/' : e.name);
                        printLine(names.join('  ') || '(empty)');
                        break;
                    }
                    case 'cd': {
                        const target = args[0] || '/';
                        if (target === '..') {
                            const parts2 = cwd.split('/').filter(Boolean);
                            parts2.pop();
                            cwd = '/' + parts2.join('/') || '/';
                        } else if (target.startsWith('/')) {
                            const node = VFS.getNode(target);
                            if (node && node.type === 'folder') cwd = target;
                            else printLine('cd: no such directory: ' + target, 'error');
                        } else {
                            const newPath = cwd === '/' ? '/' + target : cwd + '/' + target;
                            const node = VFS.getNode(newPath);
                            if (node && node.type === 'folder') cwd = newPath;
                            else printLine('cd: no such directory: ' + target, 'error');
                        }
                        break;
                    }
                    case 'pwd':
                        printLine(cwd);
                        break;
                    case 'mkdir': {
                        if (!args[0]) { printLine('mkdir: missing operand', 'error'); break; }
                        const path = cwd === '/' ? '/' + args[0] : cwd + '/' + args[0];
                        if (VFS.createFolder(path)) printLine('Created: ' + path, 'success');
                        else printLine('mkdir: failed to create', 'error');
                        break;
                    }
                    case 'touch': {
                        if (!args[0]) { printLine('touch: missing operand', 'error'); break; }
                        const path = cwd === '/' ? '/' + args[0] : cwd + '/' + args[0];
                        if (VFS.writeFile(path, '')) printLine('Created: ' + path, 'success');
                        else printLine('touch: failed', 'error');
                        break;
                    }
                    case 'cat': {
                        if (!args[0]) { printLine('cat: missing operand', 'error'); break; }
                        const path = cwd === '/' ? '/' + args[0] : cwd + '/' + args[0];
                        const content = VFS.readFile(path);
                        if (content !== null) printLine(typeof content === 'object' ? JSON.stringify(content) : content);
                        else printLine('cat: no such file', 'error');
                        break;
                    }
                    case 'echo':
                        printLine(args.join(' ') || '');
                        break;
                    case 'rm': {
                        if (!args[0]) { printLine('rm: missing operand', 'error'); break; }
                        const path = cwd === '/' ? '/' + args[0] : cwd + '/' + args[0];
                        if (VFS.deleteEntry(path)) printLine('Removed: ' + path, 'success');
                        else printLine('rm: failed to remove', 'error');
                        break;
                    }
                    case 'clear':
                        output.innerHTML = '';
                        break;
                    case 'uptime': {
                        const uptime = Math.floor((Date.now() - state.bootTime) / 1000);
                        const d = Math.floor(uptime / 86400),
                            h = Math.floor((uptime % 86400) / 3600),
                            m = Math.floor((uptime % 3600) / 60);
                        printLine(`Uptime: ${d}d ${h}h ${m}m`);
                        break;
                    }
                    case 'whoami':
                        printLine('opencore-user');
                        break;
                    case 'date':
                        printLine(new Date().toString());
                        break;
                    default:
                        printLine(`command not found: ${command}`, 'error');
                }
            }

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const cmd = input.value;
                    input.value = '';
                    processCommand(cmd);
                }
            });
            // Focus
            input.focus();
            win.addEventListener('click', () => input.focus());
            printLine('Welcome to OpencoreOS Terminal v1.0', 'success');
            printLine('Type "help" for commands.');
        }

        // ================================================================
        //  TASK MANAGER
        // ================================================================
        function initTaskManager(win) {
            const cpuEl = win.querySelector('#tmCpu');
            const memEl = win.querySelector('#tmMem');
            const countEl = win.querySelector('#tmCount');
            const listEl = win.querySelector('#taskList');

            function updateTasks() {
                // CPU (simulated)
                cpuEl.textContent = Math.round(Math.random() * 20 + 5) + '%';
                // Memory
                const mem = performance.memory ? (performance.memory.usedJSHeapSize / (1024 * 1024)).toFixed(1) : 'N/A';
                memEl.textContent = mem + ' MB';
                // Count
                countEl.textContent = state.windows.length;
                // List
                listEl.innerHTML = '';
                state.windows.forEach(w => {
                    const title = w.element.querySelector('.window-title')?.textContent || 'Unknown';
                    const div = document.createElement('div');
                    div.className = 'task-item';
                    div.innerHTML =
                        `<span class="name">${title}</span><button class="kill-btn" data-wid="${w.id}">End Task</button>`;
                    listEl.appendChild(div);
                });
                listEl.querySelectorAll('.kill-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const wid = btn.dataset.wid;
                        closeWindow(wid);
                        updateTasks();
                    });
                });
                setTimeout(updateTasks, 2000);
            }
            updateTasks();
        }

        // ================================================================
        //  MUSIC (Spotify Search + Embed)
        // ================================================================
        function initMusic(win) {
            const searchInput = win.querySelector('#musicSearchInput');
            const searchBtn = win.querySelector('#musicSearchBtn');
            const resultsDiv = win.querySelector('#musicResults');
            const playerDiv = win.querySelector('#musicPlayer');

            // Load Spotify Client ID from localStorage
            const clientId = localStorage.getItem('opencore_spotify_client_id') || '';
            const clientSecret = localStorage.getItem('opencore_spotify_client_secret') || '';

            async function searchSpotify(query) {
                if (!clientId || !clientSecret) {
                    resultsDiv.innerHTML =
                        `<p style="color:#ff6b6b;">❌ Please set your Spotify Client ID & Secret in Settings first.</p>`;
                    return;
                }
                try {
                    // Get token
                    const tokenResp = await fetch('https://accounts.spotify.com/api/token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Authorization': 'Basic ' + btoa(clientId + ':' + clientSecret)
                        },
                        body: 'grant_type=client_credentials'
                    });
                    const tokenData = await tokenResp.json();
                    if (!tokenData.access_token) { throw new Error('Invalid credentials'); }
                    const token = tokenData.access_token;

                    // Search
                    const searchResp = await fetch(
                        `https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=8`, {
                            headers: { 'Authorization': 'Bearer ' + token }
                        });
                    const data = await searchResp.json();
                    if (!data.tracks || data.tracks.items.length === 0) {
                        resultsDiv.innerHTML = `<p style="color:#888;">No results found.</p>`;
                        return;
                    }
                    resultsDiv.innerHTML = '';
                    data.tracks.items.forEach(track => {
                        const div = document.createElement('div');
                        div.className = 'music-result-item';
                        const img = track.album.images[0]?.url || '';
                        div.innerHTML = `
                            <div class="info">
                                ${img ? `<img src="${img}" />` : ''}
                                <div><div class="title">${track.name}</div><div class="artist">${track.artists.map(a => a.name).join(', ')}</div></div>
                            </div>
                            <button class="launch-btn" style="background:#1db954;" data-uri="${track.uri}">▶ Play</button>
                        `;
                        resultsDiv.appendChild(div);
                    });
                    resultsDiv.querySelectorAll('[data-uri]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const uri = btn.dataset.uri;
                            const trackId = uri.split(':')[2];
                            playerDiv.innerHTML =
                                `<iframe src="https://open.spotify.com/embed/track/${trackId}" style="width:100%;height:80px;border:none;"></iframe>`;
                        });
                    });
                } catch (err) {
                    resultsDiv.innerHTML =
                        `<p style="color:#ff6b6b;">❌ Search error: ${err.message}. Check your Spotify credentials in Settings.</p>`;
                }
            }

            searchBtn.addEventListener('click', () => {
                const q = searchInput.value.trim();
                if (q) searchSpotify(q);
            });
            searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchBtn.click(); });

            // Handle direct link paste: if user pastes a Spotify track link, extract ID
            searchInput.addEventListener('paste', () => {
                setTimeout(() => {
                    const val = searchInput.value;
                    const match = val.match(/spotify\.com\/track\/([a-zA-Z0-9]+)/);
                    if (match) {
                        playerDiv.innerHTML =
                            `<iframe src="https://open.spotify.com/embed/track/${match[1]}" style="width:100%;height:80px;border:none;"></iframe>`;
                        searchInput.value = '';
                    }
                }, 100);
            });
        }

        function initCalculator(win) {
            const display = win.querySelector('#calcDisplay');
            let current = '';
            win.querySelectorAll('.calc-grid button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const val = btn.dataset.val;
                    if (val === 'C') { current = '';
                        display.value = '0'; return; }
                    if (val === '=') {

                            display.value = result;
                            current = String(result);
                        } catch { display.value = 'Error';
                            current = ''; }
                        return;
                    }
                    current += val;
                    display.value = current;
                });
            });
        }
